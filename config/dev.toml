# =============================================================================
# NexusAI — Development Environment Profile (config/dev.toml)
# =============================================================================
# Auto-loaded when NEXUS_ENV=dev via msgspec TOML parser.
# Zastępuje: config/dev.env (python-dotenv)
# Nowy:     msgspec.toml — ultraszybki parser TOML, zero dodatkowych zależności
#
# UWAGA: Klucze TOML dopasowane do NEXUS_* env var names.
# Np. debug=true → NEXUS_DEBUG=1, sqlite_file="nexus_oltp.db" → NEXUS_SQLITE_FILE=...
# Sekcje TOML (np. [database]) są pomijane przy tworzeniu ENV keys.

[core]
debug = 1
env = "dev"
log_level = "debug"
base_dir = ""

[security]
jwt_expiration_seconds = 900
refresh_token_days = 30
jwt_issuer = "nexus-ai-dev"
jwt_audience = "nexus-api-dev"
cors_origins = "*"
csrf_enabled = 0
jwt_secret = ""
encryption_key = ""

[database]
sqlite_file = "nexus_oltp.db"
duckdb_file = "nexus_olap.duckdb"
duckdb_memory_limit = "512MB"
duckdb_threads = 2
idempotency_db = "idempotency.sqlite"
db_pool_size = 5
db_pool_overflow = 10
sqlcipher_key_env = "NEXUS_SQLCIPHER_KEY"

[nats]
nats_url = "nats://localhost:4222"
nats_max_reconnect = 10
nats_reconnect_delay = 2
outbox_replay_limit = 100

[storage]
storage_dir = "app_data/uploads"
max_invoice_upload_mb = 50
max_attachment_upload_mb = 500

[retry]
max_task_retries = 3
retry_backoff_base = 1.0
retry_backoff_max = 60.0

[models]
council_alpha_model = "models/LFM2.5-1.2B-Q4_K_M.gguf"
council_beta_model = "models/Qwen3-0.6B-Q4_K_M.gguf"
council_gamma_model = "models/LittleLamb-0.3B-Q4_K_M.gguf"
rules_model = "models/granite-4.0-1b-nano-Q4_K_M.gguf"
analytics_model = "models/qwen2.5-1.5b-instruct-Q4_K_M.gguf"
fin_detective_model = "models/fin-rwkv-169m.pth"
orchestrator_model = "models/LittleLamb-0.3B-Q4_K_M.gguf"

[autopilot]
autopilot_auto_post = 0.92
autopilot_suggest = 0.75
autopilot_ask = 0.50
autopilot_adaptation = 1
autopilot_learning_rate = 0.05
autopilot_low_amount = 500.0

[analytics]
analytics_anomaly_threshold = 2.0
decision_timeout = 60

[monitoring]
dpo_alert_webhook = ""
