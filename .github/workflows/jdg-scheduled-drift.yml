# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI JDG — Scheduled Drift Detection (P27 R10)
# ═══════════════════════════════════════════════════════════════════════════════
# Uruchamia temporal_drift_detector + cross_package_conflict_detector
# codziennie o 06:00 UTC. Raportuje przez GitHub Issues.
# ═══════════════════════════════════════════════════════════════════════════════

name: JDG Scheduled Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'  # Codziennie o 06:00 UTC
  workflow_dispatch:       # Ręczne uruchomienie

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: Temporal + Cross-Package Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for drift detection

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Temporal Drift Detector
        id: drift
        run: |
          echo "=== Temporal Drift Detection ==="
          python JDG/tools/temporal_drift_detector.py --check 2>&1 | tee /tmp/drift-report.txt
          echo "drift_exit=$?" >> $GITHUB_OUTPUT

      - name: Run Cross-Package Conflict Detector
        id: conflict
        run: |
          echo "=== Cross-Package Conflict Detection ==="
          python JDG/tools/cross_package_conflict_detector.py --json 2>&1 | tee /tmp/conflict-report.json
          echo "conflict_exit=$?" >> $GITHUB_OUTPUT

      - name: Create Issue if Drift Detected
        if: steps.drift.outputs.drift_exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/drift-report.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 [AUTO] Temporal Drift Detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Temporal Drift Report\n\n\`\`\`\n${report.substring(0, 60000)}\n\`\`\`\n\n> Auto-generated by JDG Scheduled Drift Detection (P27 R10)`,
              labels: ['legal-change', 'auto-generated', 'p27']
            });

      - name: Create Issue if Conflicts Detected
        if: steps.conflict.outputs.conflict_exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/conflict-report.json', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [AUTO] Cross-Package Conflicts Detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Cross-Package Conflict Report\n\n\`\`\`json\n${report.substring(0, 60000)}\n\`\`\`\n\n> Auto-generated by JDG Scheduled Drift Detection (P27 R10)`,
              labels: ['cross-package', 'auto-generated', 'p27']
            });

  manifest-sync:
    name: Manifest Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for drift detection

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Manifest vs Disk
        run: |
          echo "=== Manifest Consistency ==="
          python JDG/tools/generate_manifest.py --verify 2>&1
