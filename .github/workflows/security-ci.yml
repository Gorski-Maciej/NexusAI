name: Security CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public staging URL to scan with ZAP baseline"
        required: true
        default: "https://example.com/api/v2/health"

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets

  dast-zap-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url }}
          fail_action: false
