name: sast-semgrep

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]
  schedule:
    - cron: '30 4 * * *'

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep CLI (SARIF)
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config p/security-audit --config p/secrets --config p/python --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
