name: dast-zap

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API in background
        env:
          NEXUS_ENV: dev
          NEXUS_DEBUG: '0'
          NEXUS_JWT_SECRET: ci-local-jwt-secret
          NEXUS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          PYTHONPATH=Code python -m uvicorn api.app:create_app --factory --host 0.0.0.0 --port 8000 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v2/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "API failed to become ready for ZAP scan" >&2
            exit 1
          fi

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:8000'
          fail_action: true
          cmd_options: '-a -m 5'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
