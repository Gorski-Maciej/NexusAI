name: Performance k6

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "API base URL"
        required: true
        default: "http://localhost:8000"
      token:
        description: "JWT token for protected endpoints"
        required: true

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: grafana/setup-k6-action@v1
      - name: Run performance engineering gate
        run: |
          python Code/SKRIPTS/performance_engineering.py \
            --base-url "${{ github.event.inputs.base_url }}" \
            --token "${{ github.event.inputs.token }}" \
            --vus 50 \
            --duration 5m
