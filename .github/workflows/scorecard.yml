# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Scorecard / OpenSSF Security Analysis
# ═══════════════════════════════════════════════════════════════════════════════
#
# Automatyczna analiza bezpieczeństwa repozytorium przez OpenSSF Scorecard.
# Generuje badge bezpieczeństwa i raport SARIF widoczny w GitHub Security tab.
#
# SUPERMOCE:
#   - scorecard-action — automatyczna ocena bezpieczeństwa
#   - SARIF upload — wyniki w GitHub Security tab
#   - schedule: weekly — regularna ocena
#   - workflow_dispatch — na żądanie
#   - publish-results — badge w README
#
# ═══════════════════════════════════════════════════════════════════════════════

name: OpenSSF Scorecard

on:
  schedule:
    - cron: "0 7 * * 1"  # Każdy poniedziałek 7:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true  # Badge w README

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: openssf-scorecard

      - name: Generate Scorecard badge markdown
        run: |
          echo "## 🔒 OpenSSF Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![OpenSSF Scorecard](https://api.securityscorecards.dev/projects/github.com/${{ github.repository }}/badge)](https://securityscorecards.dev/viewer/?uri=github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the GitHub Security tab." >> $GITHUB_STEP_SUMMARY
