# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — CI/CD Pipeline (pixi-based)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Zgodnie z aa3fvcx.txt:
#   - pixi zastępuje Dockera dla środowiska deweloperskiego
#   - pytest-anyio (zamiast pytest-asyncio) dla testów asynchronicznych
#   - Ruff jako linter (zamiast flake8/black)
#   - Maturin do budowania rozszerzeń Rust (nexus-crypto)
#   - Nuitka do kompilacji finalnego .exe
#
# Wymaga: curl -fsSL https://pixi.sh/install.sh | sh
#         pixi install --environment dev
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# ── Konfiguracja cache dla pixi ──────────────────────────────────────────────
env:
  PIXI_CACHE_DIR: ~/.cache/pixi

# ══════════════════════════════════════════════════════════════════════════════
# Jobs
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ── Lint: Ruff (szybki linter + formatter w Rust) ─────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Run Ruff linter
        run: pixi run --environment dev lint

      - name: Run Ruff formatter check
        run: pixi run --environment dev format-check

  # ── Typecheck: mypy (statyczna analiza typów) ────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Run mypy typecheck
        run: pixi run --environment dev typecheck

  # ── Security Scan: Semgrep SAST ────────────────────────────────────────
  # Uruchamia statyczną analizę bezpieczeństwa kodu przez Semgrep.
  # Wykrywa: SQL injection, XSS, hardcoded secrets, unsafe deserialization,
  #          użycie eval/exec, path traversal, itp.
  # Policy: lenient (0 high, 20 medium) — nie blokuje PR przy średnich
  #         znaleziskach, ale ostrzega.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Run security scan (Semgrep SAST)
        run: pixi run --environment dev security-scan

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-report
          path: reports/
          retention-days: 30

  # ── Test: pytest (pytest-anyio, pytest-cov, crosshair) ───────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Run tests (pytest-anyio)
        run: pixi run --environment dev test

      - name: Run tests with coverage
        run: pixi run --environment dev test-coverage

      - name: Generate HTML coverage report
        if: always()
        run: pixi run --environment dev pytest --cov=nexus_ai --cov-report=html --no-cov-on-fail

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ── Build Rust extension: nexus-crypto (PyO3 + Maturin) ─────────────────
  # Uwaga: Tylko platformy zdefiniowane w pixi.toml → platforms = ["linux-64", "linux-aarch64"]
  # macOS wymaga dodania platform do pixi.toml.
  build-rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Build nexus-crypto (Maturin)
        run: pixi run --environment dev build-rust-release

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: nexus_ai/rust/target/wheels/*.whl
          retention-days: 7

  # ── Build standalone .exe: Nuitka ────────────────────────────────────────
  build-nuitka:
    needs: [test, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Download Rust wheels
        uses: actions/download-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: dist/wheels/

      - name: Install Rust wheel
        run: pixi run --environment dev pip install dist/wheels/*.whl

      - name: Build with Nuitka
        run: pixi run --environment dev build-nuitka

      - name: Upload Nuitka build
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-${{ matrix.os }}
          path: dist/nexus-ai*
          retention-days: 30

  # ── Release: GitHub Release z załącznikami ───────────────────────────────
  release:
    needs: [build-nuitka]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all Nuitka builds
        uses: actions/download-artifact@v4
        with:
          pattern: nexus-ai-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-ai-*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## NexusAI ${{ github.ref_name }}

            Zobacz [RELEASE_NOTES.md](./RELEASE_NOTES.md) po szczegóły.

            ### Pobierz
            - **Linux**: `nexus-ai-linux` (standalone .bin)
            - **Windows**: `nexus-ai-windows` (standalone .exe)
            - **Instalator Windows**: dostępny osobno (Inno Setup)

