# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — CI/CD Pipeline (pixi + uv)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Dwa równoległe entry pointy:
#   1. pixi (główny) — pełne środowisko z zależnościami systemowymi (OCR, OpenCV)
#   2. uv (szybka alternatywa) — tylko PyPI, 10-100× szybszy dla lint/typecheck
#
# Zgodnie z aa3fvcx.txt:
#   - pixi zastępuje Dockera dla środowiska deweloperskiego
#   - uv (Astral) — najszybszy menedżer pakietów PyPI (Rust), 10-100× szybszy od pip
#   - pytest-anyio (zamiast pytest-asyncio) dla testów asynchronicznych
#   - Ruff jako linter (zamiast flake8/black)
#   - Maturin do budowania rozszerzeń Rust (nexus-crypto)
#   - Nuitka do kompilacji finalnego .exe
#
# Wymaga:
#   pixi: curl -fsSL https://pixi.sh/install.sh | sh
#         pixi install --environment dev
#   uv:   curl -LsSf https://astral.sh/uv/install.sh | sh
#         uv sync
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# ── Konfiguracja cache dla pixi i uv ────────────────────────────────────────
env:
  PIXI_CACHE_DIR: ~/.cache/pixi
  UV_CACHE_DIR: ~/.cache/uv
  UV_LINK_MODE: copy  # Zgodne z pixi/termux (brak hardlinków)

# ══════════════════════════════════════════════════════════════════════════════
# Jobs
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ── Environment matrix: dev + prod ──────────────────────────────────────
  # Testuje instalację i podstawowe działanie w obu środowiskach pixi.
  # Dla dev: pełny stack deweloperski. Dla prod: tylko runtime.
  test-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Install ${{ matrix.environment }} environment
        run: pixi install --environment ${{ matrix.environment }} --locked

      - name: Environment diagnostics
        run: |
          pixi run -e ${{ matrix.environment }} python --version
          pixi run -e ${{ matrix.environment }} python -c "import sys; print('✅ Environment:', '${{ matrix.environment }}', '- Python', sys.version)"

      - name: Quick smoke tests (dev only)
        if: matrix.environment == 'dev'
        run: pixi run -e dev pytest -x --timeout=30 -q -k "smoke or quick" tests/ 2>/dev/null || echo "ℹ️ No smoke tests found"

  # ── Lint (fast): pixi exec --spec ruff ───────────────────────────────────
  # Używa pixi exec zamiast pełnej synchronizacji środowiska — tylko ruff
  # w efemerycznym środowisku. 3× szybszy niż lint-uv (pomija instalację
  # całego stacka deweloperskiego).
  lint-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Ruff linter (pixi exec)
        run: pixi exec --spec ruff -- ruff check nexus_ai/

      - name: Ruff formatter check (pixi exec)
        run: pixi exec --spec ruff -- ruff format --check nexus_ai/

  # ── Typecheck (fast): pixi exec --spec mypy ──────────────────────────────
  # Używa pixi exec zamiast pełnej synchronizacji — tylko mypy
  # w efemerycznym środowisku.
  typecheck-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Mypy typecheck (pixi exec)
        run: pixi exec --spec mypy -- mypy nexus_ai/

  # ── Test (uv): pytest — faster alternative using setup-uv ────────────────
  test-uv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment
        run: uv sync --only-dev

      - name: Run tests with coverage (uv)
        run: uv run pytest -x -v --timeout=30 --cov=nexus_ai --cov-report=term-missing

  # ── Lint: Ruff (szybki linter + formatter w Rust) ─────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run Ruff linter
        run: pixi run --environment dev lint

      - name: Run Ruff formatter check
        run: pixi run --environment dev format-check

  # ── Typecheck: mypy (statyczna analiza typów) ────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run mypy typecheck
        run: pixi run --environment dev typecheck

  # ── Security Scan: Semgrep SAST ────────────────────────────────────────
  # Uruchamia statyczną analizę bezpieczeństwa kodu przez Semgrep.
  # Wykrywa: SQL injection, XSS, hardcoded secrets, unsafe deserialization,
  #          użycie eval/exec, path traversal, itp.
  # Policy: lenient (0 high, 20 medium) — nie blokuje PR przy średnich
  #         znaleziskach, ale ostrzega.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run security scan (Semgrep SAST)
        run: pixi run --environment dev security-scan

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-report
          path: reports/
          retention-days: 30

  # ── Test: pytest (pytest-anyio, pytest-cov, crosshair) ───────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run tests (pytest-anyio)
        run: pixi run --environment dev test

      - name: Run tests with coverage
        run: pixi run --environment dev test-coverage

      - name: Generate HTML coverage report
        if: always()
        run: pixi run --environment dev pytest --cov=nexus_ai --cov-report=html --no-cov-on-fail

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ── Build Rust extension: nexus-crypto (PyO3 + Maturin) ─────────────────
  # Uwaga: Tylko platformy zdefiniowane w pixi.toml → platforms = ["linux-64", "linux-aarch64"]
  # macOS wymaga dodania platform do pixi.toml.
  build-rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Build nexus-crypto (Maturin)
        run: pixi run --environment dev build-rust-release

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: nexus_ai/rust/target/wheels/*.whl
          retention-days: 7

  # ── Build standalone .exe: Nuitka ────────────────────────────────────────
  build-nuitka:
    needs: [test, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Download Rust wheels
        uses: actions/download-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: dist/wheels/

      - name: Install Rust wheel
        run: pixi run --environment dev pip install dist/wheels/*.whl

      - name: Build with Nuitka
        run: pixi run --environment dev build-nuitka

      - name: Upload Nuitka build
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-${{ matrix.os }}
          path: dist/nexus-ai*
          retention-days: 30

  # ── Release: GitHub Release z załącznikami ───────────────────────────────
  release:
    needs: [build-nuitka]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all Nuitka builds
        uses: actions/download-artifact@v4
        with:
          pattern: nexus-ai-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-ai-*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## NexusAI ${{ github.ref_name }}

            Zobacz [RELEASE_NOTES.md](./RELEASE_NOTES.md) po szczegóły.

            ### Pobierz
            - **Linux**: `nexus-ai-linux` (standalone .bin)
            - **Windows**: `nexus-ai-windows` (standalone .exe)
            - **Instalator Windows**: dostępny osobno (Inno Setup)

