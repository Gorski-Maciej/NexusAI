# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# Trzy równoległe entry pointy:
#   1. hatch (główny, primary) — unified pipeline przez hatch envs + nexus-build
#   2. pixi — środowisko z zależnościami systemowymi (OCR, OpenCV, libxml2)
#   3. uv — szybka alternatywa dla PyPI-only (10-100× szybszy od pip)
#
# Zgodnie z aa3fvcx.txt:
#   - hatch jest centrum build orchestracji (pyproject.toml [tool.hatch.envs])
#   - nexus-build CLI (nexus_ai/build/hooks.py) deleguje do hatch envs
#   - pixi zastępuje Dockera dla zależności systemowych
#   - uv (Astral) — najszybszy menedżer pakietów PyPI
#   - Nuitka do kompilacji finalnego .exe (przez hatch run build:build-nuitka)
#   - Maturin do budowania rozszerzeń Rust (hatch run build:build-rust)
#   - Matrix testing: Python 3.13 + 3.13t ([[tool.hatch.envs.test.matrix]])
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# ── Konfiguracja cache ────────────────────────────────────────────────────────
env:
  PIXI_CACHE_DIR: ~/.cache/pixi
  UV_CACHE_DIR: ~/.cache/uv
  UV_LINK_MODE: copy
  HATCH_CACHE_DIR: ~/.hatch

# ══════════════════════════════════════════════════════════════════════════════
# Jobs — hatch jest głównym orkiestratorem, pixi/uv jako wsparcie
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ── Hatch CI — unified pipeline (lint + typecheck + test) ───────────────
  # Główny job CI. Używa hatch envs zdefiniowanych w pyproject.toml.
  # Deleguje do nexus-build CLI → hatch run lint:check → typecheck:check → test:run
  hatch-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.hatch/env/virtual
            ~/.cache/pip
          key: hatch-ci-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Run CI pipeline (nexus-build ci)
        run: hatch run ci

  # ── Hatch Matrix Test: Python 3.13 ───────────────────────────────────────
  # Używa [[tool.hatch.envs.test.matrix]] z pyproject.toml.
  # TODO: gdy GitHub doda wsparcie dla free-threaded Python, dodaj "3.13t"
  test-hatch-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.hatch/env/virtual
            ~/.cache/pip
          key: hatch-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Run tests via hatch
        run: hatch run test:run

      - name: Run tests with coverage
        run: hatch run test:cov

  # ── Environment matrix: dev + prod (pixi) ───────────────────────────────
  # Testuje instalację środowisk pixi. Zachowane dla system deps (OCR, OpenCV).
  test-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Install ${{ matrix.environment }} environment
        run: pixi install --environment ${{ matrix.environment }} --locked

      - name: Environment diagnostics
        run: |
          pixi run -e ${{ matrix.environment }} python --version
          pixi run -e ${{ matrix.environment }} python -c "import sys; print('✅ Environment:', '${{ matrix.environment }}', '- Python', sys.version)"

      - name: Quick smoke tests (dev only)
        if: matrix.environment == 'dev'
        run: pixi run -e dev pytest -x --timeout=30 -q -k "smoke or quick" tests/ 2>/dev/null || echo "ℹ️ No smoke tests found"

  # ── mypyc compilation: typed Python → C (2-5× speedup) ────────────────
  # Kompiluje wszystkie kandydujące moduły przez mypyc.
  # needs: [build-rust] — nexus-crypto musi być zbudowane przed mypyc,
  #       ponieważ niektóre moduły importują nexus_crypto na poziomie modułu.
  # Używa exclude list z pyproject.toml [tool.mypyc] dla plików z dynamicznymi importami.
  # Cache .so files dla szybszych kolejnych buildów.
  # Uruchamia testy na skompilowanym kodzie, aby zweryfikować poprawność.
  mypyc-compile:
    needs: [build-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download Rust wheels (nexus-crypto)
        uses: actions/download-artifact@v4
        with:
          name: nexus-crypto-ubuntu-latest
          path: dist/wheels/

      - name: Install nexus-crypto wheel + dev tools (mypyc, pytest)
        run: |
          uv pip install dist/wheels/nexus_crypto-*.whl
          uv pip install mypyc pytest pytest-anyio

      - name: Cache mypyc compiled *.so files
        uses: actions/cache@v4
        with:
          path: |
            **/*.cpython-313*.so
            **/*.so
            .mypy_cache/
          key: mypyc-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'nexus_ai/tax/**/*.py', 'nexus_ai/core/**/*.py', 'nexus_ai/services/**/*.py', 'nexus_ai/db/**/*.py', 'nexus_ai/events/**/*.py') }}

      - name: Compile with mypyc (all Category A — 57+ service files + core + db + events)
        continue-on-error: true
        run: |
          uv run mypyc \
            nexus_ai/tax \
            nexus_ai/core \
            nexus_ai/services \
            nexus_ai/db \
            nexus_ai/events

      - name: Run smoke tests on compiled code (tax math engine)
        continue-on-error: true
        run: uv run pytest tests/test_tax_math_engine.py -x -v --timeout=30 -q

      - name: List compiled *.so files
        run: find . -name "*.so" -type f | sort | head -20

      - name: Upload mypyc compiled .so files (for Nuitka build step)
        uses: actions/upload-artifact@v4
        with:
          name: mypyc-compiled-so
          path: |
            **/*.cpython-313*.so
            **/*.so
          retention-days: 1

  # ── Benchmark: mimalloc vs system allocator ────────────────────────────
  # Porównuje wydajność z mimalloc (LD_PRELOAD) i bez (system malloc).
  # Mierzy: czas alokacji, fragmentację, zużycie RAM.
  # Uruchamia testy 'test_tax_math_engine.py' i 'test_rules_engine.py'
  # w obu konfiguracjach i porównuje wyniki.
  benchmark-mimalloc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Install mimalloc system-wide
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmimalloc-dev 2>/dev/null || \
            (echo "libmimalloc not in apt, building from source..." && \
             git clone --depth 1 https://github.com/microsoft/mimalloc.git /tmp/mimalloc && \
             cd /tmp/mimalloc && mkdir -p build && cd build && \
             cmake ../.. -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF && \
             make -j$(nproc) && sudo make install && sudo ldconfig)

      - name: Verify mimalloc installation
        run: |
          ldconfig -p | grep mimalloc || echo "libmimalloc not in ldconfig cache"
          ls -la /usr/lib/libmimalloc* 2>/dev/null || ls -la /usr/local/lib/libmimalloc* 2>/dev/null || echo "libmimalloc not found"

      - name: Detect libmimalloc path
        id: detect
        run: |
          for p in \
            /usr/lib/x86_64-linux-gnu/libmimalloc.so \
            /usr/lib/aarch64-linux-gnu/libmimalloc.so \
            /usr/lib/libmimalloc.so \
            /usr/local/lib/libmimalloc.so; \
          do \
            if [ -f "$p" ]; then \
              echo "path=$p" >> $GITHUB_OUTPUT; \
              echo "Detected libmimalloc at: $p"; \
              break; \
            fi; \
          done
          if [ -z "${{ steps.detect.outputs.path }}" ]; then \
            # Fallback: use ldconfig
            path=$(ldconfig -p | grep libmimalloc | head -1 | awk '{print $NF}'); \
            if [ -n "$path" ]; then \
              echo "path=$path" >> $GITHUB_OUTPUT; \
              echo "Detected libmimalloc via ldconfig at: $path"; \
            fi; \
          fi

      - name: Test WITHOUT mimalloc (baseline)
        id: baseline
        continue-on-error: true
        run: |
          echo "Running baseline tests (no mimalloc)..."
          pixi run --environment dev pytest tests/test_tax_math_engine.py tests/test_rules_engine.py -v --timeout=60 --tb=short -q 2>&1 | tee /tmp/baseline_output.txt
          echo "baseline_exit=$?" >> $GITHUB_OUTPUT

      - name: Test WITH mimalloc (LD_PRELOAD)
        id: with_mimalloc
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.detect.outputs.path }}
          MIMALLOC_SHOW_STATS: "1"
          MIMALLOC_LARGE_OS_PAGES: "1"
          MIMALLOC_EAGER_COMMIT_DELAY: "0"
        run: |
          echo "Running comparison tests WITH mimalloc (LD_PRELOAD)..."
          pixi run --environment dev pytest tests/test_tax_math_engine.py tests/test_rules_engine.py -v --timeout=60 --tb=short -q 2>&1 | tee /tmp/mimalloc_output.txt
          echo "mimalloc_exit=$?" >> $GITHUB_OUTPUT

      - name: Generate benchmark report
        run: |
          echo "## mimalloc Benchmark Report" > /tmp/benchmark_report.md
          echo "" >> /tmp/benchmark_report.md
          echo "| Test | Without mimalloc | With mimalloc | Difference |" >> /tmp/benchmark_report.md
          echo "|------|-----------------|---------------|------------|" >> /tmp/benchmark_report.md
          echo "| Exit code | ${{ steps.baseline.outputs.baseline_exit }} | ${{ steps.mimalloc.outputs.mimalloc_exit }} | - |" >> /tmp/benchmark_report.md
          echo "" >> /tmp/benchmark_report.md
          echo "### MIMALLOC_SHOW_STATS output (see CI logs for details)" >> /tmp/benchmark_report.md
          echo "MIMALLOC_SHOW_STATS=1 was set for the mimalloc run." >> /tmp/benchmark_report.md
          echo "Check the 'Test WITH mimalloc' step logs for allocator statistics printed on exit." >> /tmp/benchmark_report.md
          cat /tmp/benchmark_report.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: mimalloc-benchmark-report
          path: /tmp/benchmark_report.md
          retention-days: 90

  # ── Lint (fast): pixi exec ───────────────────────────────────────────────
  lint-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Ruff linter (pixi exec)
        run: pixi exec --spec ruff -- ruff check nexus_ai/

      - name: Ruff formatter check (pixi exec)
        run: pixi exec --spec ruff -- ruff format --check nexus_ai/

  # ── Typecheck (fast): pixi exec ──────────────────────────────────────────
  typecheck-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Mypy typecheck (pixi exec)
        run: pixi exec --spec mypy -- mypy nexus_ai/

  # ── Test (uv): pytest — faster alternative using setup-uv ────────────────
  test-uv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment
        run: uv sync --only-dev

      - name: Run tests with coverage (uv)
        run: uv run pytest -x -v --timeout=30 --cov=nexus_ai --cov-report=term-missing

  # ── Lint: Ruff (szybki linter + formatter w Rust) ─────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run Ruff linter
        run: pixi run --environment dev lint

      - name: Run Ruff formatter check
        run: pixi run --environment dev format-check

  # ── Typecheck: mypy (statyczna analiza typów) ────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run mypy typecheck
        run: pixi run --environment dev typecheck

  # ── Schemathesis: Property-based API Fuzzing ───────────────────────────
  # Uruchamia automatycze testy API oparte o schemat OpenAPI.
  # Wykrywa:
  #   - Naruszenia schematu odpowiedzi (status codes, headers, body)
  #   - Brakujące lub błędne walidacje danych wejściowych
  #   - Błędy 5xx
  #   - Luki bezpieczeństwa (SQL injection, XSS)
  #   - Problemy wydajnościowe (response time > 5s)
  #
  # SUPERMOCE:
  #   --mode ci      — zrównoważone testy dla CI (mixed + positive + smoke)
  #   --mode security — security-focused fuzzing (negative data + XSS/SQLi)
  #   --mode all     — wszystkie testy + stateful workflows
  #
  # Inspiracja: posthog/posthog — schemathesis w CI dla każdego PR
  schemathesis-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment
        run: uv sync --only-dev

      - name: Run schemathesis CI fuzzing
        run: |
          python scripts/schemathesis_runner.py \
            --mode ci \
            --max-examples 10 \
            --format junit \
            --workers auto
        continue-on-error: true  # Nie blokuje PR — tylko informuje

      - name: Upload schemathesis JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-junit-report
          path: reports/schemathesis-junit.xml
          retention-days: 30

  # ── Schemathesis Security Fuzzing (osobny job, cięższy) ────────────────
  schemathesis-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment
        run: uv sync --only-dev

      - name: Run schemathesis security fuzzing
        run: |
          python scripts/schemathesis_runner.py \
            --mode security \
            --max-examples 50 \
            --format junit
        continue-on-error: true

      - name: Upload security fuzzing report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-security-report
          path: reports/schemathesis-junit.xml
          retention-days: 30

  # ── Security Scan: Semgrep SAST ────────────────────────────────────────
  # Uruchamia statyczną analizę bezpieczeństwa kodu przez Semgrep.
  # Wykrywa: SQL injection, XSS, hardcoded secrets, unsafe deserialization,
  #          użycie eval/exec, path traversal, itp.
  # Policy: lenient (0 high, 20 medium) — nie blokuje PR przy średnich
  #         znaleziskach, ale ostrzega.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run security scan (Semgrep SAST)
        run: pixi run --environment dev security-scan

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-report
          path: reports/
          retention-days: 30

  # ── Test: pytest (pytest-anyio, pytest-cov, crosshair) ───────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
          cache: true

      - name: Verify lockfile (--locked)
        run: pixi install --environment dev --locked

      - name: Run tests (pytest-anyio)
        run: pixi run --environment dev test

      - name: Run tests with coverage
        run: pixi run --environment dev test-coverage

      - name: Generate HTML coverage report
        if: always()
        run: pixi run --environment dev pytest --cov=nexus_ai --cov-report=html --no-cov-on-fail

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ── Build Rust extension: nexus-crypto przez Maturin (ABI3 + strip) ────
  # Konfiguracja:
  #   - ABI3 (abi3-py312) — jeden wheel na Python ≥3.12 (3.12, 3.13, 3.13t)
  #   --strip — usuwa symbole debug, 30-40% mniejszy .whl
  #   - LTO + codegen-units=1 — maksymalna optymalizacja
  #   - Cross-platform: Linux x86_64, Windows x86_64
  #   - Cache Rust toolchain + cargo registry dla szybszych buildów
  build-rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # Default host target (x86_64-unknown-linux-gnu na Linux,
        # x86_64-pc-windows-msvc na Windows) jest wystarczające
        # dla kompilacji Maturin — nie dodajemy extra targets

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nexus_ai/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nexus_ai/rust/Cargo.lock') }}

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.hatch/env/virtual
            ~/.cache/pip
          key: hatch-build-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Build Rust (nexus-build rust via hatch) — ABI3 + strip
        run: hatch run build:build-rust

      - name: List built wheels
        run: ls -lh nexus_ai/rust/target/wheels/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: nexus_ai/rust/target/wheels/*.whl
          retention-days: 7

  # ── PGO (Profile-Guided Optimization) — Nuitka ────────────────────────────
  # PGO tworzy instrumentowany binary, uruchamia go z reprezentatywnymi danymi
  # testowymi, a następnie przebudowuje z zebranym profilem.
  # Efekt: 15-40% szybszy kod, szczególnie w pętlach i gorących ścieżkach.
  #
  # Proces:
  #   1. Build z --pgo (instrumentowany binary → main.pgo)
  #   2. Uruchom instrumentowany binary z sample data (zbiera profile)
  #   3. Rebuild bez --pgo (Nuitka automatycznie używa zebranych profili)
  #
  # Uwaga: --pgo wymaga GCC (--clang nie wspiera --pgo).
  pgo-benchmark:
    needs: [test-hatch-matrix, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ~/.cache/ccache
      NUITKA_CACHE_DIR: ~/.cache/nuitka
    steps:
      - uses: actions/checkout@v4

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-pgo-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'nexus_ai/**/*.py') }}
          restore-keys: |
            ccache-pgo-${{ runner.os }}-

      - name: Cache NUITKA_CACHE_DIR
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-pgo-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nuitka-pgo-${{ runner.os }}-

      - name: Install system deps (ccache, GCC)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache g++

      - name: Download Rust wheels
        uses: actions/download-artifact@v4
        with:
          name: nexus-crypto-ubuntu-latest
          path: dist/wheels/

      - name: Step 1 — Build instrumented binary (--pgo)
        id: pgo-build
        continue-on-error: true
        run: |
          echo "=== Step 1: Building instrumented binary (--pgo) ==="
          pip install dist/wheels/nexus_crypto-*.whl
          hatch run build:build-nuitka -- --pgo
          echo "pgo_build_exit=$?" >> $GITHUB_OUTPUT
          # The PGO instrumented binary is named main.pgo or similar
          ls -la dist/ 2>/dev/null || echo "No dist files yet"

      - name: Step 2 — Run instrumented binary with sample data
        if: steps.pgo-build.outputs.pgo_build_exit == '0'
        id: pgo-profile
        continue-on-error: true
        run: |
          echo "=== Step 2: Running instrumented binary to collect profiles ==="
          # Find the PGO instrumented binary
          PGO_BIN=$(find dist -name "*.pgo" -o -name "*pgo*" 2>/dev/null | head -1)
          if [ -z "$PGO_BIN" ]; then
            # Fallback: main binary was built with --pgo, just run it
            PGO_BIN=$(find dist -name "NexusAI*" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$PGO_BIN" ]; then
            echo "Running PGO binary: $PGO_BIN"
            chmod +x "$PGO_BIN"
            # Run with --help to generate baseline profile
            "$PGO_BIN" --help 2>&1 || true
            # Run with sample CLI commands to exercise hot paths
            "$PGO_BIN" --version 2>&1 || true
            # Run health check (if supported)
            "$PGO_BIN" doctor --quick 2>&1 || true
          else
            echo "No PGO binary found in dist/"
            ls -la dist/ 2>/dev/null
          fi
          echo "pgo_profile_exit=$?" >> $GITHUB_OUTPUT

      - name: Step 3 — Rebuild optimized binary (PGO profiles collected)
        if: steps.pgo-build.outputs.pgo_build_exit == '0'
        run: |
          echo "=== Step 3: Rebuilding optimized binary with PGO profiles ==="
          # Rebuild WITHOUT --pgo — Nuitka automatically uses the collected profiles
          hatch run build:build-nuitka
          echo "Rebuild complete."

      - name: Verify final binary
        run: |
          echo "Final binary:"
          ls -lh dist/NexusAI* 2>/dev/null || echo "Binary not found in dist/"
          file dist/NexusAI* 2>/dev/null || true

      - name: Upload PGO-optimized binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-pgo-ubuntu-latest
          path: dist/nexus-ai*
          retention-days: 30

  # ── Build standalone .exe: Nuitka przez hatch (z mypyc .so) ───────────────
  build-nuitka:
    needs: [test-hatch-matrix, build-rust, mypyc-compile]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CCACHE_DIR: ~/.cache/ccache
      NUITKA_CACHE_DIR: ~/.cache/nuitka
    steps:
      - uses: actions/checkout@v4

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Cache hatch environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.hatch/env/virtual
            ~/.cache/pip
          key: hatch-nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Cache ccache (Nuitka C++ compilation cache — 10-50x faster rebuilds)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'nexus_ai/**/*.py') }}
          restore-keys: |
            ccache-nuitka-${{ runner.os }}-

      - name: Cache NUITKA_CACHE_DIR (Nuitka compiled module cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nuitka-cache-${{ runner.os }}-

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install ccache --no-progress

      - name: Download Rust wheels
        uses: actions/download-artifact@v4
        with:
          name: nexus-crypto-${{ matrix.os }}
          path: dist/wheels/

      - name: Download mypyc compiled .so files (Linux only — Nuitka picks them up)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: mypyc-compiled-so
          path: ./

      - name: Build with Nuitka via hatch (prefer-source-code=no picks up .so)
        run: hatch run build:build-nuitka
        env:
          NUITKA_CACHE_DIR: ~/.cache/nuitka
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || echo "ccache stats unavailable"

      - name: Upload Nuitka build
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-${{ matrix.os }}
          path: dist/nexus-ai*
          retention-days: 30

  # ── Release: hatch build + GitHub Release ───────────────────────────────────
  release:
    needs: [build-nuitka]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pipx
        run: pip install pipx && pipx ensurepath

      - name: Install hatch
        run: pipx install hatch

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nexus-*
          merge-multiple: true

      - name: Create GitHub Release via hatch
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-ai-*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## NexusAI ${{ github.ref_name }}

            ### Pobierz
            - **Linux**: `nexus-ai-linux` (standalone .bin)
            - **Windows**: `nexus-ai-windows` (standalone .exe)

