# ═══════════════════════════════════════════════════════════════════════════════
# Dependabot Configuration — NexusAI v7.0 (Rec #9)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Automatyczne aktualizacje zależności z podziałem na:
#   - pip (Python) — codziennie, minor/patch, auto-merge dla patch
#   - cargo (Rust) — co tydzień
#   - github-actions — co tydzień
#
# ═══════════════════════════════════════════════════════════════════════════════

version: 2
updates:

  # ── Python dependencies (pip/pixi) ─────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Warsaw"
    labels:
      - "dependencies"
      - "python"
      - "auto-merge"
    reviewers:
      - "Gorski-Maciej"
    commit-message:
      prefix: "deps"
      prefix-development: "dev-deps"
      include: "scope"
    open-pull-requests-limit: 5
    target-branch: "main"
    versioning-strategy: increase
    groups:
      lint-typing:
        patterns:
          - "ruff"
          - "mypy"
          - "mypyc"
        update-types:
          - "minor"
          - "patch"
      o11y:
        patterns:
          - "opentelemetry*"
          - "structlog"
          - "sentry-sdk"
        update-types:
          - "minor"
          - "patch"
      msgspec:
        patterns:
          - "msgspec"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
      - dependency-name: "tensorflow"
      - dependency-name: "torch"

  # ── Rust dependencies (nexus-crypto) ───────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/nexus_ai/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "Gorski-Maciej"
    commit-message:
      prefix: "cargo"
      include: "scope"
    open-pull-requests-limit: 3

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    labels:
      - "dependencies"
      - "ci"
      - "auto-merge"
    reviewers:
      - "Gorski-Maciej"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
