# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Composite Action: Setup UV
# ═══════════════════════════════════════════════════════════════════════════════
# Użyj w jobie:
#   steps:
#     - uses: ./.github/actions/setup-uv
#
# SUPERMOCE:
#   - composite action — DRY
#   - astral-sh/setup-uv z enable-cache

name: "Setup UV"
description: "Installs uv (Astral) package manager with cache"

inputs:
  sync-env:
    description: "Run uv sync --only-dev after setup"
    default: "true"
    type: string

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync environment
      shell: bash
      if: ${{ inputs.sync-env == 'true' }}
      run: uv sync --only-dev

    - name: Verify uv
      shell: bash
      run: |
        uv --version
        echo "✅ UV ready"
