# ═══════════════════════════════════════════════════════════════════════════════
# pixi.toml — NexusAI All-in-One Environment Manager
# ═══════════════════════════════════════════════════════════════════════════════
#
# Zgodnie z aa3fvcx.txt: pixi zastępuje Dockera, conda i ręczne skrypty
# apt-get. Jeden plik definiuje wszystko:
#   - Python ≥3.13 — interpreter
#   - Pakiety PyPI (Litestar, Taskiq, DuckDB, itd.)
#   - Zależności systemowe (Tesseract, OpenCV, libxml, SQLCipher)
#
# Instalacja pixi:
#   curl -fsSL https://pixi.sh/install.sh | sh
#
# Szybki start:
#   pixi install           # Stwórz środowisko (tylko runtime)
#   pixi run api           # Uruchom serwer API
#   pixi shell             # Aktywuj shell w środowisku
#
# Środowisko deweloperskie (z testami/linterem/buildem):
#   pixi install --environment dev
#   pixi run --environment dev test
#
# ═══════════════════════════════════════════════════════════════════════════════

[workspace]
name = "nexus-ai"
version = "2.0.0"
description = "NexusAI — Ultralekki, autonomiczny system księgowy z AI"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]   # win-64 dla Nuitka + Inno Setup (aa3fvcx.txt)

# ══════════════════════════════════════════════════════════════════════════════
# Zależności systemowe (conda-forge) — tylko runtime
# ══════════════════════════════════════════════════════════════════════════════

[dependencies]
python = "3.13.* *_cp313t"              # Free-threaded (3.13t, bez GIL) — -30-40% RAM, prawdziwa wielowątkowość

# ── OCR i przetwarzanie obrazów ─────────────────────────────────────────────
tesseract = ">=5.3.0"                    # OCR — ekstrakcja tekstu z faktur
leptonica = ">=1.84.0"                   # Przetwarzanie obrazów dla Tesseract
libopencv = ">=4.9.0"                    # OpenCV — preprocessing obrazów

# ── XML / Document processing ───────────────────────────────────────────────
libxml2 = ">=2.12.0"                     # XML parser (dla lxml)
libxslt = ">=1.1.39"                     # XSLT (dla lxml)

# ── Database ─────────────────────────────────────────────────────────────────
pkg-config = ">=0.29.2"                  # Wykrywanie bibliotek systemowych

# ── mimalloc — Microsoft memory allocator (5-15% mniej RAM) ────────────────
# Zgodnie z aa3fvcx.txt: podmienia standardowy malloc, minimalna fragmentacja,
# wysoka wydajność w wielowątkowości. Używany przez LD_PRELOAD dla wszystkich
# procesów w środowisku pixi oraz jako statyczny plugin w Nuitka build.
mimalloc = ">=2.1.0"                    # Microsoft mimalloc — 5-15% mniej RAM

# ── Rust toolchain (dla Maturin / PyO3 / nexus-crypto) ──────────────────────
rust = ">=1.78.0"

# ══════════════════════════════════════════════════════════════════════════════
# Zależności PyPI — tylko runtime
# ══════════════════════════════════════════════════════════════════════════════

[pypi-dependencies]

# ── API / ASGI ──────────────────────────────────────────────────────────────
litestar = { version = ">=2.8.0", extras = ["jwt"] }
granian = ">=1.0.0"

# ── Database ────────────────────────────────────────────────────────────────
sqlmodel = ">=0.0.16"
sqlite-vec = ">=0.1.0"
alembic = ">=1.13.0"

# ── Serialization & Async ───────────────────────────────────────────────────
msgspec = ">=0.18.0"
anyio = ">=4.4.0"

# ── Task Queue / Messaging ──────────────────────────────────────────────────
taskiq = ">=0.11.0"
taskiq-nats = ">=0.5.0"
nats-py = ">=2.6.0"

# ── HTTP / Networking ───────────────────────────────────────────────────────
httpx = ">=0.27.0"
hishel = ">=0.1.0"
fsspec = ">=2024.3.0"

# ── Resilience ──────────────────────────────────────────────────────────────
stamina = ">=0.1.0"

# ── Cryptography (lokalny moduł Rust) ───────────────────────────────────────
nexus-crypto = { path = "./nexus_ai/rust", editable = true }

# ── Document / Image processing ─────────────────────────────────────────────
lxml = ">=5.1.0"
xsdata = ">=24.0.0"           # XSD → Python code generation (KSeF)
pillow = ">=10.0.0"
pymupdf = ">=1.24.0"           # PDF → image conversion (OCR pipeline)
paddlepaddle = ">=3.0.0"       # Deep learning OCR engine
paddleocr = ">=2.8.0"          # PaddleOCR — drugi silnik OCR
surya-ocr = ">=0.4.0"          # Surya OCR — trzeci silnik OCR (layout-aware)

# ── Analytics / OLAP ────────────────────────────────────────────────────────
duckdb = ">=1.0.0"
pyarrow = ">=15.0.0"
polars = ">=1.0.0"

# ── Model Hub ───────────────────────────────────────────────────────────────
huggingface-hub = ">=0.23.0"

# ── Logging ─────────────────────────────────────────────────────────────────
loguru = ">=0.7.0"
structlog = ">=24.0.0"

# ── Monitoring ──────────────────────────────────────────────────────────────
opentelemetry-api = ">=1.25.0"
opentelemetry-sdk = ">=1.25.0"
opentelemetry-exporter-prometheus = ">=0.46b0"

# ── Utilities ───────────────────────────────────────────────────────────────
psutil = ">=5.9.0"
pendulum = ">=3.0.0"
numpy = ">=2.0.0"
sentry-sdk = ">=2.0.0"        # Error tracking SDK



# ══════════════════════════════════════════════════════════════════════════════
# System requirements
# ══════════════════════════════════════════════════════════════════════════════

[system-requirements]
linux = "2.27"

# ══════════════════════════════════════════════════════════════════════════════
# Activation — zmienne środowiskowe przy pixi run / pixi shell
# ══════════════════════════════════════════════════════════════════════════════
# Te zmienne są automatycznie ustawiane przy każdym `pixi run` lub `pixi shell`.
# Dzięki temu środowisko pixi ma te same zmienne co mise.toml [env].
# {PIXI_PROJECT_ROOT} to zmienna pixi wskazująca na katalog projektu.

[activation.env]
NEXUS_LOG_LEVEL = "info"
NEXUS_HOST = "127.0.0.1"
NEXUS_PORT = "8000"
NEXUS_DB_PATH = "${PIXI_PROJECT_ROOT}/app_data/nexus.db"

# ── mimalloc — dynamiczne przeładowanie alokatora przez LD_PRELOAD ───────────
# Po `pixi install` wszystkie procesy w środowisku (API, worker, testy) używają
# mimalloc jako domyślnego alokatora. Zero zmiany kodu — natychmiastowy zysk.
# {PIXI_ROOT_PREFIX} to katalog instalacyjny pixi (conda-forge prefix).
LD_PRELOAD = "$CONDA_PREFIX/lib/libmimalloc.so"
# Uwaga: $CONDA_PREFIX jest ustawiane przez pixi przed zastosowaniem [activation.env]
# To ten sam wzorzec co w nexus_ai/db/database.py (L21) dla libsqlcipher.so

# ── Konfiguracja mimalloc (zgodnie z dokumentacją v3.3.2) ───────────────────
# Włącz ogromne strony OS (TLB miss reduction) dla wydajności modeli AI
MIMALLOC_LARGE_OS_PAGES = "1"
# Rezerwacja huge pages dla dużych alokacji (modele GGUF ~800MB)
MIMALLOC_RESERVE_HUGE_OS_PAGES = "1"
# Szybsze commitowanie pamięci — niższe opóźnienia alokacji
MIMALLOC_EAGER_COMMIT_DELAY = "0"
# Page reset wyłączony dla long-running procesów (worker, API)
MIMALLOC_PAGE_RESET = "0"
# Statystyki wyłączone domyślnie — włącz przez `export MIMALLOC_SHOW_STATS=1`
MIMALLOC_SHOW_STATS = "0"

# ══════════════════════════════════════════════════════════════════════════════
# Tasks — komendy ORKIESTRACJI środowiska (pixi-specific)
# ══════════════════════════════════════════════════════════════════════════════
#
# UWAGA: Większość tasków dev (test, lint, build, migrate, seed, itp.) została
# przeniesiona do mise.toml — mise jest teraz głównym task runnerem projektu.
# pixi.toml zawiera tylko taski, które są specyficznie związane z zarządzaniem
# środowiskiem pixi:
#   - shell      — aktywacja shella pixi
#   - gen-requirements — generowanie requirements.txt
#   - build-nuitka-win — build Windows z Inno Setup (wymaga pixi environment)
#   - build-rust-release — build .whl przez maturin (wymaga pixi environment)
#
# Do uruchamiania dev, testów, lintera, buildów itp. używaj:
#   mise run dev
#   mise run test
#   mise run lint
#
# ══════════════════════════════════════════════════════════════════════════════

[tasks]

# ── Shell ────────────────────────────────────────────────────────────────────
shell = { cmd = "$SHELL || cmd || pwsh", description = "Aktywuj shell w środowisku pixi" }

# ══════════════════════════════════════════════════════════════════════════════
# Feature: dev — narzędzia programistyczne (testy, lint, build, cmake)
# ══════════════════════════════════════════════════════════════════════════════
# Używaj:   pixi install --environment dev   # instaluj runtime + dev
#           pixi run --environment dev test  # uruchom testy
#           pixi run --environment dev lint  # sprawdź kod
#           pixi run --environment dev build-nuitka  # skompiluj .exe
# ══════════════════════════════════════════════════════════════════════════════

[feature.dev.dependencies]
# Dev-specific conda packages
cmake = ">=3.28.0"         # Potrzebne do kompilacji llama-cpp-python z CUDA

[feature.dev.pypi-dependencies]
# ── Testowanie ──────────────────────────────────────────────────────────────
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
pytest-anyio = ">=0.1.0"          # natywne async test fixtures (anyio)
hypothesis = ">=6.100.0"          # Zachowany dla złożonych property-based tests
crosshair = ">=0.1.0"             # SMT-driven property testing (zastępuje hypothesis w nowym stacku)
schemathesis = ">=3.0.0"          # Property-based API testing (OpenAPI)
locust = ">=2.0.0"               # Load testing w Pythonie
py-spy = ">=0.3.0"               # Sampling profiler (bez GIL)

# ── Linter / Formatter / Type checker ───────────────────────────────────────
ruff = ">=0.3.0"
mypy = ">=1.8.0"

# ── Build tool — Nuitka (kompilacja Python → C → .exe) ────────────────────
nuitka = ">=1.8"

# ── Security scanning — Semgrep SAST ───────────────────────────────────────
semgrep = ">=1.40.0"

[feature.dev.tasks]
# ── Testowanie ──────────────────────────────────────────────────────────────
# (przeniesione do mise.toml — używaj: mise run test)

# ── Build — kompilacja do .exe z instalatorem Windows (pixi-specific) ──────
# build-nuitka-win — zdefiniowane jako sub-table [feature.dev.tasks.build-nuitka-win] poniżej

# ── Build — moduł Rust (pixi-specific: koło .whl) ──────────────────────────
# build-rust-release — zdefiniowane jako sub-table [feature.dev.tasks.build-rust-release] poniżej

# ── Narzędzia (pixi-specific) ───────────────────────────────────────────────
gen-requirements = "uv export --format requirements-txt -o requirements.txt"

# ── Platform-specific: build-nuitka-win (tylko win-64) ───────────────────
# Task dostępny tylko na Windows — Nuitka kompiluje .exe, Inno Setup tworzy instalator.
# Uruchom: pixi run --environment dev build-nuitka-win
[feature.dev.tasks.build-nuitka-win]
cmd = "python -m nuitka --project-name=nexus-ai main.py && iscc nexus_ai/installer/build_scripts/setup.iss"
description = "Skompiluj .exe + stwórz instalator Windows"
platforms = ["win-64"]

# ── Task caching: build-rust-release ────────────────────────────────────
# Cache unieważniany gdy zmienią się źródła Rust, Cargo.toml lub Cargo.lock.
# Wynikowe .whl są przechowywane jako outputs — jeśli istnieją i inputs się
# nie zmieniły, pixi pomija wykonanie taska.
# Uruchom: pixi run --environment dev build-rust-release
[feature.dev.tasks.build-rust-release]
cmd = "cd nexus_ai/rust && maturin build --release --strip"
description = "Skompiluj nexus-crypto (koło binarne .whl)\n--strip: usuwa symbole debug → 30-40% mniejszy .whl\nABI3 (abi3-py312): jeden wheel na Python ≥3.12"
inputs = [
    "nexus_ai/rust/src/**/*.rs",
    "nexus_ai/rust/Cargo.toml",
    "nexus_ai/rust/Cargo.lock",
    "nexus_ai/rust/pyproject.toml",
]
outputs = ["nexus_ai/rust/target/wheels/nexus_crypto-*.whl"]

# ══════════════════════════════════════════════════════════════════════════════
# Environments
# ══════════════════════════════════════════════════════════════════════════════
# pixi install              = środowisko prod (tylko runtime)
# pixi run --environment dev test  = środowisko dev (runtime + testy + lint)

[environments]
dev = { features = ["dev"], solve-group = "default" }
prod = { solve-group = "default" }
