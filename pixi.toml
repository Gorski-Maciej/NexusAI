# ═════════════════════════════════════════════════════════════════════════════
# pixi.toml — menedżer środowiska „wszystko w jednym"
# ═════════════════════════════════════════════════════════════════════════════
#
# pixi zastępuje: Docker, conda, apt-get, venv, ręczne skrypty.
# Jeden plik definiuje: wersję Pythona, pakiety PyPI i zależności systemowe.
#
# Instalacja:  curl -fsSL https://pixi.sh/install.sh | sh
# Użycie:      pixi install        # Instaluje całe środowisko
#              pixi run python     # Uruchamia w izolowanym środowisku
#              pixi shell          # Aktywuje powłokę w środowisku
#
# ═════════════════════════════════════════════════════════════════════════════

[project]
name = "nexus-ai"
version = "2.0.0"
description = "NexusAI — Ultralekki, autonomiczny system księgowy z AI"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

# ── Python ≥3.13 free-threaded (bez GIL) ─────────────────────────────────────
# Używamy specjalnego wariantu 3.13t, w którym usunięto Global Interpreter Lock.
# Dzięki temu zadania równoległe (AI, OCR, analityka) działają jako zwykłe wątki
# w jednym procesie, współdzieląc pamięć — oszczędność 30-40% RAM.
[tasks]
# Taski uruchamiane przez `pixi run <task_name>`
api = "python -c 'from api.server import run_backend; run_backend()'"
worker = "python -m luz.worker"
desktop = "python -m luz.main"
test = "pytest tests/ -v"
lint = "ruff check Code/"
typecheck = "mypy Code/"

[dependencies]
# Środowisko uruchomieniowe
python = "3.13.*"
pip = ">=24.0"

# Zależności systemowe (instalowane przez conda/pixi — nie przez apt)
tesseract = ">=5.3"
leptonica = ">=1.82"
poppler = ">=24.0"
libcxx = ">=16.0"

[pypi-dependencies]
# API / ASGI
litestar = ">=2.8.0"
granian = ">=1.0.0"

# Database
sqlmodel = ">=0.0.16"
aiosqlite = ">=0.20.0"
sqlite-vec = ">=0.1.0"
alembic = ">=1.13.0"
duckdb = ">=1.0.0"
pyarrow = ">=15.0.0"
polars = ">=1.0.0"

# Serialization (ultraszybka)
msgspec = ">=0.18.0"

# Async
anyio = ">=4.4.0"

# Task Queue / Messaging
taskiq = ">=0.11.0"
taskiq-nats = ">=0.5.0"
nats-py = ">=2.6.0"

# HTTP / Networking
httpx = ">=0.27.0"
hishel = ">=0.1.0"
fsspec = ">=2024.3.0"

# Resilience
stamina = ">=0.1.0"

# Document / XML
lxml = ">=5.1.0"
pillow = ">=10.0.0"

# LLM Inference
llama-cpp-python = ">=0.2.0"
huggingface-hub = ">=0.23.0"

# Logging
loguru = ">=0.7.0"

# Metrics
prometheus-client = ">=0.20.0"

# Utilities
psutil = ">=5.9.0"
py-moneyed = ">=3.0"

# Testing
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=5.0.0"
hypothesis = ">=6.100.0"
ruff = ">=0.3.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"

[feature.ui.dependencies]
flet = ">=0.28.0"

# ── Domyślna cecha zawiera wszystko ─────────────────────────────────────────
[feature.default]
channels = ["conda-forge"]
dependencies = { python = "3.13.*" }

# ── Systemowe pakiety przez conda (pixi pobiera je z conda-forge) ───────────
[system-requirements]
libc = ">=2.35"  # Dla kompatybilności z nowszymi dystrybucjami Linux
