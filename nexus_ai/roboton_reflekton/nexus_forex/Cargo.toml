[package]
name = "nexus-forex"
version = "0.1.0"
edition = "2021"
description = "NexusAI — native currency conversion module (Rust + PyO3)"

[lib]
name = "_forex"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
