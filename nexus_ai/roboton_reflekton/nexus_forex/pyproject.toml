[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "nexus-forex"
version = "0.1.0"
description = "NexusAI — native currency module (Rust + PyO3), NBP rates, currency conversion"
requires-python = ">=3.13"

[tool.maturin]
module-name = "nexus_forex._forex"
manifest-path = "nexus_ai/roboton_reflekton/nexus_forex/Cargo.toml"
