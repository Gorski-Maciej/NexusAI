[alembic]
script_location = %(here)s/migrations
prepend_sys_path = Code
sqlalchemy.url = sqlite:///nexus_oltp.db

file_template = %%(rev)s_%%(slug)s

timezone = UTC

post_write_hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 100
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
