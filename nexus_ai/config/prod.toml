# =============================================================================
# NexusAI — Production Environment Profile (config/prod.toml)
# =============================================================================
# Auto-loaded when NEXUS_ENV=prod via msgspec TOML parser.
# Zastępuje: config/prod.env (python-dotenv)
# Nowy:     msgspec.toml — ultraszybki parser TOML, zero dodatkowych zależności
#
# UWAGA: Klucze TOML dopasowane do NEXUS_* env var names.
# Sekcje TOML (np. [database]) są pomijane przy tworzeniu ENV keys.
#
# IMPORTANT: The following secrets MUST be set via env vars or Infiscal:
#   - NEXUS_JWT_SECRET
#   - NEXUS_ENCRYPTION_KEY
#   - NEXUS_ADMIN_PASSWORD

[core]
debug = 0
env = "prod"
log_level = "warning"
base_dir = ""

[security]
jwt_expiration_seconds = 900
refresh_token_days = 7
jwt_issuer = "nexus-ai-prod"
jwt_audience = "nexus-api-prod"
# WARNING: cors_origins MUST be set to a specific domain in production!
# Example: cors_origins = "https://app.example.com"
cors_origins = "*"
csrf_enabled = 1
jwt_secret = ""
encryption_key = ""

[database]
sqlite_file = "nexus_oltp.db"
duckdb_file = "nexus_olap.duckdb"
duckdb_memory_limit = "4GB"
duckdb_threads = 4
idempotency_db = "idempotency.sqlite"
db_pool_size = 10
db_pool_overflow = 20
sqlcipher_key_env = "NEXUS_SQLCIPHER_KEY"

[nats]
nats_url = "nats://nats:4222"
nats_max_reconnect = 10
nats_reconnect_delay = 2
outbox_replay_limit = 500

[storage]
storage_dir = "app_data/uploads"
max_invoice_upload_mb = 100
max_attachment_upload_mb = 1000

[retry]
max_task_retries = 3
retry_backoff_base = 1.0
retry_backoff_max = 60.0

[autopilot]
autopilot_auto_post = 0.95
autopilot_suggest = 0.80
autopilot_ask = 0.55
autopilot_adaptation = 0
autopilot_learning_rate = 0.05
autopilot_low_amount = 500.0

[rules]
rules_max_amount = 50000.0
rules_require_nip = 1

[analytics]
analytics_anomaly_threshold = 2.5
decision_timeout = 120

[monitoring]
dpo_alert_webhook = ""
