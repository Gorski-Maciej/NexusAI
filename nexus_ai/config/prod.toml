# ═══════════════════════════════════════════════════════════════════════════════
# config/prod.toml — NexusAI Production Profile
# ═══════════════════════════════════════════════════════════════════════════════
#
# Zgodnie z aa3fvcx.txt:
# - msgspec parsuje TOML → zero zależności od python-dotenv/pydantic-settings
# - W produkcji: debug=false, OpenAPI/Swagger wyłączone
# - Wymagane: NEXUS_JWT_SECRET, NEXUS_ENCRYPTION_KEY (env vars)
#
# Ładowane przez: ConfigLoader (core/config.py)
# Użycie: NEXUS_ENV=prod
# ═══════════════════════════════════════════════════════════════════════════════

[app]
# ── Core ──
environment = "prod"
debug = false
base_dir = "/opt/nexusai"

# ── Database ──
sqlite_file = "app_data/databases/nexus_oltp.db"
duckdb_file = "app_data/databases/nexus_olap.duckdb"
storage_dir = "app_data/uploads"
idempotency_db = "app_data/databases/idempotency.sqlite"

# ── DuckDB ──
duckdb_memory_limit = "2GB"
duckdb_threads = 4

# ── Server ──
host = "127.0.0.1"
port = 8000
log_level = "INFO"

# ── CORS (prod: konkretne originy) ──
cors_origins = "http://localhost:8501,http://127.0.0.1:8501"

# ── Upload limits ──
max_invoice_upload_mb = 50
max_attachment_upload_mb = 500

# ── JWT (wymagane z env vars) ──
jwt_expiration_seconds = 900
refresh_token_days = 30
jwt_issuer = "nexus-ai"
jwt_audience = "nexus-api"

# ── CSRF ──
csrf_enabled = true

# ── Connection pools ──
db_pool_size = 10
db_pool_overflow = 20
nats_max_reconnect = 30
nats_reconnect_delay_seconds = 5

[storage]
# ── SUPERMOC fsspec: Jednolita abstrakcja systemów plików ──
protocol = "file"
root = "app_data/uploads"
auto_mkdir = true
cache_size_mb = 0

# ── Retry (stamina) ──
max_task_retries = 5
retry_backoff_base_seconds = 2.0
retry_backoff_max_seconds = 120.0

# ── Decision Engine ──
autopilot_auto_post_threshold = 0.95
autopilot_suggest_threshold = 0.80
autopilot_ask_threshold = 0.55
autopilot_adaptation_enabled = true
autopilot_adaptation_learning_rate = 0.03
autopilot_low_amount_threshold = 500.0

# ── Rules ──
rules_max_invoice_amount = 100000.0
rules_require_nip_validation = true
analytics_anomaly_threshold = 1.5

# ── Timeouts ──
decision_timeout_seconds = 120

# ── Outbox ──
outbox_replay_limit = 100

# ── Migration baselines ──
migration_baseline_file = "migration_rowcount_baseline.json"
migration_checksum_baseline_file = "migration_checksum_baseline.json"

[tax]
# ── Tax configuration ──
default_vat_rate = 23
cit_rate = 19
linear_rate = 12
lump_sum_rates = [2.0, 3.0, 5.5, 8.5, 12.0, 15.0, 17.0]
vat_exempt_threshold = 200000.0
vat_quarterly_threshold = 2000000.0

[integrations]
# ── External API endpoints ──
nbp_api_url = "https://api.nbp.pl/api/exchangerates/rates/a/"
ksef_api_url = "https://ksef.mf.gov.pl/api/"
gus_bir_api_url = "https://wyszukiwarka.ceidg.gov.pl/CEIDG"
white_list_api_url = "https://wl-api.mf.gov.pl/api/"
dpo_alert_webhook = ""  # Ustaw przez env var NEXUS_DPO_ALERT_WEBHOOK

[nats]
# ── NATS JetStream ──
url = "nats://localhost:4222"
max_reconnect = 30
reconnect_delay_seconds = 5

[tigerbeetle]
# ── TigerBeetle ledger ──
cluster_id = 0
replica_addresses = "3000"

[security]
# ── SUPERMOC Litestar: Security config ──
jwt_exclude_paths = [
    "/api/auth/login",
    "/api/auth/register",
    "/api/auth/refresh",
    "/api/auth/csrf-token",
    "/api/auth/reset-password",
    "/api/auth/reset-password/confirm",
    "/api/auth/confirm",
    "/api/v1/health",
    "/api/v2/health",
    "/schema/openapi.yml",
    "/schema/swagger",
]
csrf_exclude_patterns = ["/api/auth/", "/health"]
rate_limit_auth = 10
rate_limit_upload = 30
rate_limit_general = 60

[stamina]
# ── SUPERMOC: Globalne ustawienia stamina ──
retry_attempts = 5
retry_timeout = 15.0
circuit_breaker_enabled = true
circuit_breaker_cooldown = 60.0

[forex]
# ── Nexus-Forex configuration ──
enabled = true
nbp_api_url = "https://api.nbp.pl/api/exchangerates/rates/A/{currency}/{date}/?format=json"
max_lookback_days = 5
http_timeout_sec = 15
rate_cache_maxsize = 1000
refresh_interval_hours = 24
default_currencies = "EUR,USD,GBP,CHF,CZK,SEK,NOK,HUF"
missing_date_ttl_days = 30

[ai]
# ── AI Models (paths relative to base_dir/models/) ──
council_alpha_model = "models/LFM2.5-1.2B-Q4_K_M.gguf"
council_beta_model = "models/Qwen3-0.6B-Q4_K_M.gguf"
council_gamma_model = "models/LittleLamb-0.3B-Q4_K_M.gguf"
rules_model = "models/granite-4.0-1b-nano-Q4_K_M.gguf"
analytics_model = "models/qwen2.5-1.5b-instruct-Q4_K_M.gguf"
decision_jamba_model = "models/Jamba-Reasoning-3B-Q4_K_M.gguf"
decision_granite_model = "models/granite-4.0-1b-nano-Q4_K_M.gguf"
orchestrator_model = "models/LittleLamb-0.3B-Q4_K_M.gguf"
ocr_model = "models/LightOnOCR-1B-Q4_K_M.gguf"
vision_model = "models/Phi-3-mini-3.8B-Q4_K_M.gguf"
embedding_model = "models/bge-small-en-v1.5-Q4_K_M.gguf"
