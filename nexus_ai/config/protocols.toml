# =============================================================================
# NexusAI — Standard Operating Procedures (SOP)
# Centralny rejestr protokołów decyzyjnych dla wszystkich agentów
# Wersja: 2.0 (Cognitive Architecture)
# =============================================================================
#
# Ten plik definiuje sztywne protokoły postępowania dla każdego agenta w
# systemie. Zamiast pozwalać modelom AI na samodzielne wymyślanie strategii,
# protokoły te określają dokładnie co model ma robić w każdej sytuacji.
#
# Zasada: Python decyduje o workflow, model tylko wykonuje konkretne zadania
# w ramach sztywno zdefiniowanych protokołów. To eliminuje halucynacje
# i skraca czas inferencji modelu.
#
# Struktura:
#   [metadata]              — wersja, opis, data modyfikacji
#   [schema]                — definicje typów używanych w protokołach
#   [protocols.*]           — właściwe protokoły pogrupowane według agenta
#   [matrices.*]            — deterministyczne matryce decyzyjne
#   [thresholds.*]          — progi decyzyjne i wagi
#   [emergency.*]           — protokoły awaryjne (timeout, błąd modelu)
#   [sop.*]                 — Standard Operating Procedures dla całego systemu
#   [interface.*]           — definicje interfejsów między agentami
#
# =============================================================================

[metadata]
version = "2.0"
description = "NexusAI Cognitive Architecture — Standard Operating Procedures"
created_at = "2026-06-09"
updated_at = "2026-06-09"
schema_docs = "https://nexusai.internal/docs/sop-schema-v2"
cognitive_architecture = "https://nexusai.internal/docs/cognitive-architecture"

# =============================================================================
# SCHEMA — definicje typów używanych w protokołach
# =============================================================================

[schema.output_formats]
workflow_plan = '''
{
    "agents": ["EKSTRAKCJA", "WALIDACJA"] | ["EKSTRAKCJA", "WALIDACJA", "ANALITYKA", "DECYZJA"],
    "reasoning": "Krótkie uzasadnienie decyzji (1-2 zdania)"
}
'''

validation_verdict = '''
{
    "decision": "APPROVE" | "REJECT",
    "confidence": 0.0-1.0,
    "reasoning": "Krótkie uzasadnienie"
}
'''

strategic_decision = '''
{
    "decision": "AUTO_POST" | "SUGGEST" | "ESCALATE",
    "confidence": 0.0-1.0,
    "reasoning": "Szczegółowe uzasadnienie decyzji",
    "strategy_summary": "Strategiczne podsumowanie w 2-3 zdaniach"
}
'''

orchestrator_decision = '''
{
    "decision": "AUTO_POST" | "SUGGEST" | "ASK_USER" | "ESCALATE",
    "confidence": 0.0-1.0,
    "reasoning": "Uzasadnienie decyzji na podstawie arkusza faktów i protokołów",
    "action_plan": ["Krok 1: ...", "Krok 2: ..."],
    "risk_level": "low" | "medium" | "high",
    "requires_human_approval": true | false
}
'''

rules_level_4_output = '''
{
    "risk_level": "LOW" | "MEDIUM" | "HIGH",
    "confidence": 0.0-1.0,
    "anomaly_score": 0.0-1.0,
    "final_verdict": "COMPLIANT" | "FLAG",
    "reasoning": "Krótkie uzasadnienie",
    "recommended_action": "auto_post" | "review" | "block"
}
'''

rag_fact_sheet_section = '''
=== ARKUSZ FAKTÓW (FactsAggregator) ===
Źródła danych: SQLite=✓/✗, DuckDB=✓/✗, sqlite-vec=✓/✗

Faktura #{invoice_id}
  Kontrahent: {name} (NIP: {nip})
  Kwota netto: {amount_net} PLN
  Kwota brutto: {amount_gross} PLN
  Kategoria: {category}
  Data wystawienia: {issue_date}

Kontrahent: znany/nowy
  Liczba faktur w historii: {count}
  Trust score: {score}
  Status VAT: {status}
'''

few_shot_section = '''
=== PRZYKŁADY FEW-SHOT (historyczne decyzje) ===
Przykład 1:
[Podobna faktura (semantycznie, odległość: {distance})]
  Kwota brutto: {amount}
  Kategoria: {category}
  Decyzja Rady: {decision}
  Trust score: {trust}
  Status w systemie: {status}
'''

# =============================================================================
# INTERFEJSY MIĘDZY AGENTAMI — definicje kontraktów
# =============================================================================
# Każdy agent w systemie komunikuje się przez ściśle określony interfejs.
# Definiuje to wejścia, wyjścia i protokoły komunikacji między agentami.

[interface]
description = "Definicje interfejsów między agentami — kontrakty komunikacyjne"

[interface.input]
invoice_data = "dict[str, Any] — surowe dane z OCR/pipeline"
vendor_profile = "dict[str, Any] | None — profil kontrahenta z SQLite/DuckDB"
quality_report = "dict[str, Any] | None — raport z Rady Agentów (Council)"
analytics_report = "dict[str, Any] | None — raport z Agent Analitycznego"
extraction_report = "dict[str, Any] | None — raport z Agent Ekstrakcji"

[interface.output]
orchestrator_decision = '''
OrchestratorDecision {
    decision: str          # AUTO_POST | SUGGEST | ASK_USER | BLOCK | ESCALATE
    confidence: float      # 0.0 – 1.0
    reasoning: str
    workflow_plan: list[str]
    strategy_summary: str
    adapted_thresholds: dict[str, float]
    granite_context: dict[str, Any]
}
'''

[interface.contracts]
facts_aggregator_output = { type = "FactSheet", description = "Arkusz faktów ze wszystkich źródeł danych" }
council_output = { type = "CouncilVerdict", description = "Wynik głosowania Rady Agentów (Alpha/Beta/Gamma)" }
jamba_output = { type = "JambaResult", description = "Strategiczna decyzja Jamba 3B" }
rules_output = { type = "RulesResult", description = "Wynik Rules SWAT Team" }
ple_output = { type = "PLEPattern", description = "Wzorzec z Perpetual Learning Engine" }

# =============================================================================
# SOP — GŁÓWNY PROTOKÓŁ ORKIESTRACJI (AgentOrchestrator + Granite 3.2 3B)
# =============================================================================
# Cel: Centralny protokół postępowania dla AgentOrchestrator.
# Model: Granite 3.2 3B (główny model orkiestratora decyzyjnego)
# Zasada: Model nie decyduje co robić — tylko wykonuje konkretne zadania
# w ramach sztywno zdefiniowanego workflow. Python decyduje o kolejności kroków.
#
# Przepływ:
#   0. RAG: FactsAggregator.build() → FactSheet (dane ze wszystkich baz)
#   1. PLAN: WorkflowPlanner.plan() → simple/complex
#   2. RADA: Council of Agents → Alpha/Beta/Gamma głosowanie
#   3. REGUŁY: Rules SWAT Team → kaskada 4 poziomów
#   4. STRATEGIA: JambaStrategist.analyze() → decyzja końcowa
#   5. BAYES: BayesianThresholdLearner → override progów
#   6. PLE: record_decision() → zapis do pamięci
#   7. ZWRÓĆ: OrchestratorDecision

[sop.orchestration]
description = "Główny protokół orkiestracji — przepływ decyzyjny AgentOrchestrator"
version = "2.0"
models_involved = ["Granite 3.2 3B", "Jamba 3B", "LFM2.5 1.2B", "Qwen3 0.6B", "LittleLamb 0.3B", "Fin-RWKV-169M"]

[sop.orchestration.flow]
step_0 = { name = "RAG", action = "FactsAggregator.build(invoice_data)", description = "Zbierz dane ze wszystkich źródeł: SQLite, DuckDB, sqlite-vec, TigerBeetle", timeout_ms = 5000, parallel = true }
step_1 = { name = "PLAN", action = "WorkflowPlanner.plan(invoice_data, vendor, fact_sheet)", description = "Zdecyduj simple vs complex — które agenty uruchomić", timeout_ms = 10000 }
step_1b = { name = "FEW-SHOT", action = "FactSheet.build_few_shot_examples(max=3)", description = "Zbuduj dynamiczne przykłady z historii i podobnych faktur", timeout_ms = 100 }
step_2 = { name = "STRATEGY", action = "JambaStrategist.analyze(fact_sheet, few_shot, raporty)", description = "Strategiczna decyzja AUTO_POST/SUGGEST/ESCALATE", timeout_ms = 60000, model = "Jamba 3B" }
step_2b = { name = "BAYES", action = "BayesianThresholdLearner.get_thresholds(nip, category)", description = "Pobierz adaptacyjne progi bayesowskie", timeout_ms = 100 }
step_2c = { name = "OVERRIDE", action = "if conf < bayesian_próg → downgrade", description = "Bayesowski override decyzji jeśli confidence za niski", fallback = "zachowaj decyzję Jamba" }
step_3 = { name = "PLE", action = "PLE.record_decision(decision, nip, category, amount)", description = "Zapisz decyzję do STM → LTM → FM", timeout_ms = 100 }
step_4 = { name = "LOG", action = "DecisionLogger.log_decision(full_decision)", description = "Zaloguj decyzję do DuckDB", timeout_ms = 100 }
step_5 = { name = "RETURN", action = "return OrchestratorDecision(...)", description = "Zwróć końcową decyzję" }

# =============================================================================
# PROTOKOŁY — DLA GRANITE 3.2 3B (Orchestrator / Mózg Systemu)
# =============================================================================
# Cel: Sztywne protokoły postępowania dla głównego modelu decyzyjnego.
# Model: Granite 3.2 3B
# Zasada: Model otrzymuje arkusz faktów (RAG) i gotowe raporty agentów.
#          Nie szuka danych samodzielnie — dostaje je gotowe.
#          Python decyduje o kolejności kroków, model tylko klasyfikuje.

[protocols.orchestrator]
description = "Protokoły dla AgentOrchestrator / Granite 3.2 3B"
model = "Granite 3.2 3B"
output_format = "schema.output_formats.orchestrator_decision"

[protocols.orchestrator.system_prompt]
role = "Jesteś Dyrektorem Finansowym (CFO) analizującym faktury."
task = "Na podstawie arkusza faktów (RAG) i raportów agentów podejmij decyzję."
constraints = [
    "Nie szukaj danych samodzielnie — arkusz faktów zawiera wszystko czego potrzebujesz",
    "Jeśli nie masz pewności, wybierz ESCALATE zamiast zgadywać",
    "Twoja decyzja musi być oparta na konkretnych danych z arkusza faktów",
]
protocols_header = "=== PROTOKOŁY DECYZYJNE (Granite 3.2 3B) ==="

[sop.orchestrator_protocols]
description = "Standard Operating Procedures dla Granite 3.2 3B w każdej decyzji"

[sop.orchestrator_protocols.protocol_1]
name = "Niejasna kategoria wydatku"
condition = "Arkusz faktów nie zawiera jednoznacznej kategorii LUB kategoria jest niespójna z historią"
steps = [
    "Sprawdź historię kontrahenta w arkuszu faktów: czy podobne faktury były przypisywane do konkretnej kategorii w > 90% przypadków?",
    "JEŚLI tak → ZASTOSUJ tę kategorię automatycznie, informując użytkownika",
    "W PRZECIWNYM RAZIE → ZADAJ pytanie, przedstawiając 2-3 opcje na podstawie podobnych faktur",
]
fallback = "ASK_USER z propozycją 2-3 kategorii"
example = "Faktura od dostawcy IT z kwotą 1200 PLN — historia pokazuje 15/15 faktur jako 'usługi IT' → AUTO_POST z kategorią 'usługi IT'"

[sop.orchestrator_protocols.protocol_2]
name = "Wykryta anomalia cenowa"
condition = "RiskGuard LUB SemanticGuard zgłosił WARNING o znaczącym odchyleniu ceny od średniej (> 2 odchylenia standardowe)"
steps = [
    "NIE KSIĘGUJ automatycznie",
    "Ustaw status BLOCK",
    "Zapytaj użytkownika wprost: 'Czy ta cena jest poprawna?'",
    "Dołącz informację: średnia cena dla tego kontrahenta, odchylenie, liczba historycznych faktur",
]
fallback = "BLOCK — bezpieczna blokada"
example = "Faktura na 15000 PLN od kontrahenta ze średnią 1500 PLN → BLOCK z informacją o 10-krotnym odchyleniu"

[sop.orchestrator_protocols.protocol_3]
name = "Brakujące dane z OCR"
condition = "Kluczowe pole w arkuszu faktów jest puste (NIP, kwota, data)"
steps = [
    "NIE zgaduj brakujących danych",
    "Sprawdź czy podobne faktury w historii (sqlite-vec) mają ten sam wzorzec braku danych",
    "JEŚLI tak → zapytaj użytkownika sugerując dane z podobnej faktury",
    "W PRZECIWNYM RAZIE → od razu zapytaj użytkownika o brakujące dane",
]
fallback = "ASK_USER z kontekstem podobnych faktur"
example = "Pole 'nip' w danych JSON jest puste → ASK_USER: 'Proszę podać NIP kontrahenta. Podobna faktura #123 miała NIP: 1234567890'"

[sop.orchestrator_protocols.protocol_4]
name = "Nowy kontrahent — pierwsza faktura"
condition = "contractor_known == False (pierwsza faktura od tego kontrahenta)"
steps = [
    "Wymuś pełną ścieżkę: EKSTRAKCJA + WALIDACJA + ANALITYKA + DECYZJA",
    "Sprawdź kontrahenta w rejestrach: GUS BIR i Biała Lista MF przez ContextEnricher",
    "JEŚLI dane w rejestrach zgodne z fakturą → SUGGEST z adnotacją 'nowy kontrahent — zweryfikowany'",
    "JEŚLI dane niezgodne → BLOCK z informacją o rozbieżności",
    "Nigdy nie stosuj AUTO_POST dla nowego kontrahenta — zawsze wymagaj potwierdzenia",
]
fallback = "SUGGEST z wysokim priorytetem weryfikacji"
example = "Nowy kontrahent XYZ — zgodność w GUS BIR i Białej Liście → SUGGEST z trust_score=0.65"

[sop.orchestrator_protocols.protocol_5]
name = "Znany kontrahent — typowa faktura (fast-path)"
condition = "contractor_known == True ORAZ kwota w zakresie [0.5×średnia, 1.5×średnia] ORAZ kategoria zgodna z historią"
steps = [
    "Aplikuj fast-path: pomiń Radę Beta/Gamma, pomiń Rules SWAT L2-L4",
    "Alpha Agent (LFM2.5 1.2B) → jeśli confidence ≥ 0.92 → AUTO_POST",
    "AUTO_POST z adnotacją 'typowa faktura — znany kontrahent'",
]
fallback = "Pełna ścieżka jeśli Alpha < 0.92"
example = "Faktura od stałego dostawcy paliwa, kwota 4500 PLN (średnia 4200 PLN) → AUTO_POST"

[sop.orchestrator_protocols.protocol_6]
name = "Konflikt między raportami agentów"
condition = "Raport Walidatora mówi APPROVE ale Raport Analityczny mówi ESCALATE (lub odwrotnie)"
steps = [
    "Nie ufaj żadnemu z raportów w pojedynkę",
    "Zbierz wszystkie raporty: Council (Alpha/Beta/Gamma), Rules SWAT, Analytics",
    "Zastosuj matrycę 8 kombinacji głosów Rady",
    "JEŚLI matryca zwróci SUGGEST → prześlij do JambaStrategist z adnotacją o konflikcie",
    "JEŚLI matryca zwróci BLOCK → BLOCK bez dalszej analizy",
]
fallback = "ESCALATE do człowieka z pełnym zestawem raportów"
example = "Alpha=APPROVE, Beta=REJECT, Gamma=APPROVE → CONTEXT_ANOMALY_APPROVE → SUGGEST"

[sop.orchestrator_protocols.protocol_7]
name = "Wysoka kwota powyżej progu"
condition = "amount_gross > 50000 PLN (lub inny próg zdefiniowany w konfiguracji)"
steps = [
    "Zawsze uruchom pełną ścieżkę (complex)",
    "Wymuś uruchomienie Rules SWAT L4 (Fin-RWKV-169M) nawet jeśli L3 zwróci COMPLIANT",
    "Przed ostateczną decyzją sprawdź w TigerBeetle czy są dostępne środki na koncie",
    "Wymuś bayesowski override — nawet jeśli Jamba zwróci AUTO_POST, obniż do SUGGEST",
]
fallback = "BLOCK z prośbą o dodatkową autoryzację"
example = "Faktura na 120000 PLN → pełna ścieżka + L4 + sprawdzenie salda → SUGGEST"

[sop.orchestrator_protocols.protocol_8]
name = "Brak danych z TigerBeetle (ledger)"
condition = "ledger_available == False (TigerBeetle nie odpowiada lub brak połączenia)"
steps = [
    "Kontynuuj decyzję bez danych ledgerowych",
    "Oznacz w arkuszu faktów: 'TigerBeetle: niedostępny'",
    "Podnieś próg confidence o 0.05 dla AUTO_POST (brak weryfikacji salda)",
    "Zaloguj ostrzeżenie do DecisionLogger",
]
fallback = "SUGGEST z adnotacją o braku danych ledgerowych"
example = "TigerBeetle wyłączone konserwacja → decyzja na podstawie SQLite+DuckDB+sqlite-vec → SUGGEST"

# =============================================================================
# PROTOKOŁY — RAG (Retrieval-Augmented Generation przez FactsAggregator)
# =============================================================================
# Cel: Zdefiniowanie jak FactsAggregator zbiera dane przed każdą decyzją.
# Zasada: Model nigdy nie szuka danych samodzielnie — dostaje gotowy arkusz faktów.

[protocols.rag]
description = "Protokoły dla warstwy RAG (FactsAggregator)"
data_sources = ["SQLite (OLTP)", "DuckDB (OLAP)", "sqlite-vec (wektory)", "TigerBeetle (ledger)"]

[protocols.rag.before_decision]
steps = [
    "1. Uruchom wszystkie 4 źródła równolegle (asyncio.create_task)",
    "2. Dla każdego źródła: izolacja błędów — awaria jednego nie psuje reszty",
    "3. Zbuduj FactSheet z dostępnych danych",
    "4. Wygeneruj sekcję === ARKUSZ FAKTÓW === dla promptu modelu",
    "5. Jeśli dane źródłowe zmieniły się od ostatniego razu → przebuduj cache",
]
timeout = "5000ms (safe guard, każde źródło ma własny timeout)"
error_handling = "Każde źródło ma osobny try/except — awaria logowana jako warning"

[protocols.rag.data_sources.sqlite]
description = "Dane kontrahenta i historia z SQLite (OLTP)"
fields = ["contractor (NIP, nazwa, status VAT)", "recent_invoices (ostatnie 5)", "user_correction_patterns (korekty użytkownika)"]
priority = "critical — podstawowe dane kontrahenta"

[protocols.rag.data_sources.duckdb]
description = "Dane analityczne z DuckDB (OLAP)"
fields = ["trust_score_trend (ostatnie 30 dni)", "active_tax_rules (aktywne reguły podatkowe)", "vendor_intelligence (profil kontrahenta)"]
priority = "high — wspomaga decyzję kontekstową"

[protocols.rag.data_sources.sqlite_vec]
description = "Podobne faktury semantycznie przez sqlite-vec"
fields = ["similar_invoices (top 5 według cosine distance)", "distance_threshold: 0.85"]
priority = "medium — użyte dla few-shot learning"

[protocols.rag.data_sources.tigerbeetle]
description = "Dane księgowe z TigerBeetle (secure ledger)"
fields = ["ledger_accounts (salda kont)", "ledger_total_turnover (łączny obrót)", "ledger_recent_transfers (ostatnie transfery)"]
priority = "medium — dostępny tylko gdy TB skonfigurowany"

[protocols.rag.few_shot]
description = "Budowanie dynamicznych przykładów few-shot"
max_examples = 3
priority_order = [
    "1. similar_invoices — semantycznie podobne faktury (najwyższy priorytet)",
    "2. globally_similar_cases — globalnie podobne przypadki (ta sama kategoria)",
    "3. global_recent_decisions — ostatnie decyzje wszystkich kontrahentów",
    "4. recent_invoices — historia kontrahenta (najniższy priorytet)",
]
cache_strategy = "Hash danych źródłowych — jeśli niezmieniony, zwróć cache"

[protocols.rag.few_shot.decision_mapping]
PAID = "AUTO_POST"
APPROVED = "AUTO_POST"
SUGGESTED = "SUGGEST"
PENDING = "ASK_USER"
BLOCKED = "BLOCK"
default = "SUGGEST"

# =============================================================================
# PROTOKOŁY — WORKFLOW PLANNER (WorkflowPlanner)
# =============================================================================
# Cel: Zdecyduj które agenty uruchomić na podstawie złożoności faktury.
# Model: LittleLamb 0.3B (mały, szybki model)
# Zasada: Python decyduje o workflow, model tylko klasyfikuje prosty/złożony.

[protocols.workflow_planner]
description = "Planer przepływu pracy — decyduje które agenty uruchomić"
model_role = "Inteligentny orkiestrator procesu fakturowania"
output_format = "schema.output_formats.workflow_plan"

[protocols.workflow_planner.rules]
simple_threshold_amount = 5000  # PLN — poniżej = faktura prosta
simple_threshold_invoice_count = 3  # min. liczba faktur dla znanego kontrahenta
simple_threshold_ocr_confidence = 0.85  # min. OCR confidence dla fast-path

[protocols.workflow_planner.instructions]
role = """
Jesteś inteligentnym orkiestratorem procesu fakturowania.
Otrzymujesz dane faktury i profil kontrahenta.
Twoim zadaniem jest zdecydować, które kontrole są potrzebne.
"""
available_agents = [
    { id = "EKSTRAKCJA", description = "Weryfikacja danych faktury przez Agent Ekstrakcji Danych" },
    { id = "WALIDACJA", description = "Walidacja jakości przez Agent Walidator Jakości" },
    { id = "ANALITYKA", description = "Analiza trendów i wykrywanie anomalii statystycznych" },
    { id = "DECYZJA", description = "Ostateczna decyzja na podstawie wszystkich raportów" },
]

[protocols.workflow_planner.protocols.simple_invoice]
condition = "Kwota brutto ≤ 5000 PLN ORAZ kontrahent znany (invoice_count ≥ 3) ORAZ OCR confidence ≥ 0.85"
action = "Uruchom TYLKO EKSTRAKCJA + WALIDACJA"
reasoning = "Niska kwota, znany kontrahent, wysoki OCR confidence — wystarczy podstawowa weryfikacja"

[protocols.workflow_planner.protocols.complex_invoice]
condition = "Wysoka kwota LUB nowy kontrahent LUB niski OCR confidence"
action = "Uruchom PEŁNY zestaw: EKSTRAKCJA + WALIDACJA + ANALITYKA + DECYZJA"
reasoning = "Wysokie ryzyko — wymagana pełna ścieżka weryfikacji"

# =============================================================================
# PROTOKOŁY — WALIDACJA TRÓJWARSTWOWA (QualityValidatorAgent)
# =============================================================================
# Cel: Trzy warstwy walidacji z deterministyczną matrycą 8 kombinacji.
# Modele: Alpha (LFM2.5), Beta (Qwen3-0.6B), Gamma (LittleLamb)
# Zasada: Model tylko głosuje (APPROVE/REJECT). Python mapuje głosy na akcję.

[protocols.validation]
description = "Trójwarstwowa Tarcza Bezpieczeństwa — walidacja jakości danych faktury"

[protocols.validation.fast_path]
condition = "Alpha (warstwa kontekstowa) APPROVE z confidence ≥ 0.92"
action = "Pomiń warstwy Beta i Gamma — zwróć AUTO_POST"
reasoning = "Wysoki confidence warstwy kontekstowej — fast-path"

# --- Warstwa 1: Kontekstowa (Alpha Agent) ---

[protocols.validation.alpha]
description = "Warstwa kontekstowa — szybka ocena pierwszej passy"
model_role = "Doświadczony analityk finansowy"
output_format = "schema.output_formats.validation_verdict"
output_fields = ["decision", "confidence", "reasoning", "suggested_action"]

[protocols.validation.alpha.system_prompt]
role = "Jesteś doświadczonym analitykiem finansowym. Oceń fakturę — czy jest typowa, czy podejrzana."
checks = [
    "Czy faktura jest typowa dla tego kontrahenta i kategorii?",
    "Czy kwota jest w typowym zakresie?",
    "Czy dane kontrahenta są spójne?",
]

[protocols.validation.alpha.protocols.typical_invoice]
condition = "Znany kontrahent, typowa kwota, spójna kategoria"
action = "APPROVE"
reasoning = "Faktura typowa — brak przesłanek do odrzucenia"

[protocols.validation.alpha.protocols.suspicious_invoice]
condition = "Nowy kontrahent LUB nietypowa kwota LUB niespójna kategoria"
action = "REJECT"
reasoning = "Faktura nietypowa — wymaga dokładniejszej weryfikacji"

# --- Warstwa 2: Precyzji (Beta Agent) ---

[protocols.validation.beta]
description = "Warstwa precyzji — walidacja matematyczno-fiskalna"
model_role = "Skrupulatny kontroler finansowy"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["errors"]

[protocols.validation.beta.system_prompt]
role = "Jesteś skrupulatnym kontrolerem finansowym."
checks = [
    "Poprawność sumy kontrolnej NIP (10 cyfr, wagi 6,5,7,2,3,4,5,6,7)",
    "netto + VAT = brutto (tolerancja ±0.01)",
    "Czy kwota nie przekracza progów",
]

[protocols.validation.beta.protocols.passed]
condition = "Wszystkie 3 kontrole OK"
action = "APPROVE"
reasoning = "Wszystkie kontrole matematyczno-fiskalne OK"

[protocols.validation.beta.protocols.failed]
condition = "Co najmniej jedna kontrola wykryła błąd"
action = "REJECT"
reasoning = "Wykryto błędy w kontroli matematyczno-fiskalnej"

# --- Warstwa 3: Anomalii (Gamma Agent) ---

[protocols.validation.gamma]
description = "Warstwa anomalii — detekcja duplikatów i anomalii kwotowych"
model_role = "Detektyw finansowy wykrywający anomalie"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["is_duplicate", "is_amount_anomaly"]

[protocols.validation.gamma.system_prompt]
role = "Sprawdź fakturę pod kątem potencjalnego duplikatu i anomalii kwotowej."
checks = [
    "Potencjalny duplikat (ten sam numer faktury, NIP, kwota)",
    "Anomalia kwotowa (kwota znacząco odbiega od historycznej średniej)",
]

[protocols.validation.gamma.protocols.clean]
condition = "Brak duplikatu i brak anomalii kwotowej"
action = "APPROVE"
reasoning = "Brak oznak duplikatu lub anomalii"

[protocols.validation.gamma.protocols.anomaly_detected]
condition = "Wykryto duplikat LUB anomalię kwotową"
action = "REJECT"
reasoning = "Potencjalny duplikat lub anomalia kwotowa"

# =============================================================================
# PROTOKOŁY — DLA RULES SWAT TEAM (4 poziomy zgodności)
# =============================================================================

[protocols.rules]
description = "Rules SWAT Team — hierarchiczny przepływ agentów zgodności finansowej"

[protocols.rules.flow]
level_1_fast_path_confidence = 0.90
max_chain_depth = 4

[protocols.rules.level_1]
model = "LFM2.5-Thinking"
description = "Szybka ocena kontekstowa — decyzja: COMPLIANT / FLAG"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["flags"]

[protocols.rules.level_1.system_prompt]
role = "Jesteś LFM2.5-Thinking — szybki analityk kontekstowy."
task = "Oceń fakturę: czy jest typowa, czy wymaga dodatkowej weryfikacji."

[protocols.rules.level_1.flag_areas]
nip = { severity = "low|medium|high", description = "Problem z NIP-em kontrahenta" }
amount = { severity = "low|medium|high", description = "Nietypowa kwota" }
vendor = { severity = "low|medium|high", description = "Problem z kontrahentem" }
category = { severity = "low|medium|high", description = "Niespójna kategoria" }

[protocols.rules.level_1.protocols.compliant]
condition = "Typowa faktura, znany kontrahent, standardowa kwota"
action = "COMPLIANT"

[protocols.rules.level_1.protocols.flagged]
condition = "Nietypowa faktura, nowy kontrahent, niestandardowa kwota"
action = "FLAG"

[protocols.rules.level_2]
model = "Granite 4.0 1B Nano"
description = "Walidacja reguł biznesowych — NIP, limity kwotowe, polityka firmy"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["violations"]

[protocols.rules.level_2.system_prompt]
role = "Jesteś Granite 4.0 1B Nano — agent walidacji reguł biznesowych."
checks = [
    "Walidacja NIP (suma kontrolna, format)",
    "Limit kwotowy (maksymalna kwota faktury)",
    "Zgodność z polityką firmy (kategoria wydatku)",
]

[protocols.rules.level_3]
model = "LittleLamb 0.3B TC"
description = "Ternary Classifier — COMPLIANT / FLAG / VIOLATION"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["classification", "risk_factors"]

[protocols.rules.level_3.system_prompt]
role = "Jesteś LittleLamb 0.3B TC — Ternary Classifier."
task = "Sklasyfikuj fakturę: COMPLIANT (zgodna), FLAG (oznaczona), VIOLATION (naruszenie)."

[protocols.rules.level_4]
model = "Fin-RWKV-169M"
description = "Końcowa weryfikacja anomalii finansowych"
output_format = "schema.output_formats.rules_level_4_output"

[protocols.rules.level_4.system_prompt]
role = "Jesteś Fin-RWKV-169M — detektyw finansowy."
task = "Zweryfikuj końcowo anomalię finansową. Oceń ryzyko: LOW / MEDIUM / HIGH."

# =============================================================================
# PROTOKOŁY — STRATEGICZNA DECYZJA (JambaStrategist / Jamba 3B)
# =============================================================================

[protocols.decision]
description = "Strategiczna decyzja końcowa na podstawie raportów agentów"

[protocols.decision.jamba]
model = "Jamba 3B"
description = "Strateg analizujący raporty wszystkich agentów przez Jamba 3B"

[protocols.decision.jamba.system_prompt]
role = "Jesteś strategiem finansowym analizującym pełny obraz faktury."
input_sources = [
    "Agent Walidator Jakości — ocena jakości danych i anomalii",
    "Agent Analityczny — trendy i anomalie statystyczne",
    "Agent Ekstrakcji Danych — dane surowe z faktury",
]

[protocols.decision.jamba.protocols.auto_post]
condition = "Wysoki trust score, brak zastrzeżeń, znany kontrahent"
decision = "AUTO_POST"
reasoning = "Wszystkie raporty pozytywne — księguj automatycznie"

[protocols.decision.jamba.protocols.suggest]
condition = "Średni trust score, drobne zastrzeżenia"
decision = "SUGGEST"
reasoning = "Większość raportów pozytywna — sugeruj ale czekaj na potwierdzenie"

[protocols.decision.jamba.protocols.escalate]
condition = "Niski trust score, poważne zastrzeżenia lub błędy"
decision = "ESCALATE"
reasoning = "Znaczące problemy — eskaluj do człowieka"

[protocols.decision.jamba.protocols.timeout]
condition = "Brak odpowiedzi modelu w ciągu decision_timeout_seconds"
decision = "ESCALATE"
reasoning = "Timeout — bezpieczna eskalacja do człowieka"

[protocols.decision.jamba.protocols.error]
condition = "Błąd inferencji modelu"
decision = "ESCALATE"
reasoning = "Błąd — bezpieczna eskalacja do człowieka"

# =============================================================================
# PROTOKOŁY — DLA GRANITE EXECUTOR (dodatkowe zapytania do DuckDB)
# =============================================================================

[protocols.executor]
description = "Executor zapytań do DuckDB dla dodatkowego kontekstu"

[protocols.executor.granite]
model = "Granite 4.0 1B"
description = "Agent wykonawczy z dostępem do DuckDB"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["query_results"]

# =============================================================================
# PROTOKOŁY — DLA PLE ENGINE (Perpetual Learning)
# =============================================================================

[protocols.ple]
description = "Protokoły dla Perpetual Learning Engine — trójwarstwowa pamięć"

[protocols.ple.stm]
description = "Short-Term Memory — ostatnie 50 decyzji"
max_size = 50
ttl_hours = 24
decay_check_interval_minutes = 5

[protocols.ple.ltm]
description = "Long-Term Memory — kategoryzowane per kontrahent/kategoria"
max_per_bucket = 100
retention_decay = 0.95
decay_check_interval_hours = 1
min_weight = 0.1

[protocols.ple.fm]
description = "Fusion Memory — Cognitive Artifacts"
max_artifacts = 200
min_frequency_for_pattern = 2
compaction_interval_hours = 1
cleanup_age_days = 7

[protocols.ple.promotion_rules]
stm_to_ltm = "Każda decyzja → STM.push() → LTM.store()"
ltm_to_fm_decision_cache = "3+ AUTO_POST dla (NIP, kategoria) z conf ≥ 0.85 → FM.add_decision_cache()"
ltm_to_fm_pattern = "Wszystkie decyzje AUTO_POST dla (NIP, kategoria) → FM.add_pattern()"
ltm_to_fm_anomaly = "BLOCK/ASK_USER z trust < 0.5 → FM.add_anomaly_insight()"

[protocols.ple.threshold_adaptation]
fm_pattern_confidence_threshold = 0.85
auto_post_adjustment = -0.05
auto_post_minimum = 0.70

# =============================================================================
# PROTOKOŁY — DLA BAYESIAN THRESHOLD LEARNER
# =============================================================================

[protocols.bayesian]
description = "Protokoły dla Bayesowskiego Systemu Adaptacyjnych Progów"

[protocols.bayesian.prior]
distribution = "Beta(α=2, β=2)"
description = "Lekki sceptycyzm — domyślny prior dla wszystkich kontrahentów"

[protocols.bayesian.decision_weights]
low_amount_threshold = 100
medium_amount_threshold = 1000
high_amount_threshold = 10000
low_weight = 0.5
medium_weight = 1.0
high_weight = 1.5
very_high_weight = 2.0
auto_decision_multiplier = 0.3

[protocols.bayesian.hierarchy]
level_1 = "(NIP, kategoria) — najbardziej specyficzny"
level_2 = "(NIP, __global__) — ogólny dla kontrahenta"
level_3 = "BetaPosterior() — domyślny prior"

[protocols.bayesian.threshold_calculation]
low_data_points_threshold = 6
low_data_formula = "mean + 2 × uncertainty, minimum 0.85"
high_data_formula = "logit-normal approximation przez delta method"

[protocols.bayesian.override_rules]
downgrade_auto_to_suggest = "Jamba conf < bayesian_auto_post → SUGGEST"
downgrade_auto_to_ask_user = "Jamba conf < bayesian_suggest → ASK_USER"

# =============================================================================
# MATRYCA DECYZYJNA — 8 kombinacji głosów (rozszerzona)
# =============================================================================
# Deterministyczna matryca mapująca kombinację 3 głosów (Alpha, Beta, Gamma)
# na konkretną akcję. Model nie ma prawa samodzielnie decydować — tylko głosować.
# Python (QualityValidatorAgent) mapuje głosy na akcję.

[matrices.validation_verdict]
description = "Matryca 8 kombinacji głosów trzech warstw walidacji"

[matrices.validation_verdict.combinations.FULL_APPROVE]
alpha = "APPROVE"
beta = "APPROVE"
gamma = "APPROVE"
level = "LEVEL_1_AUTO"
action = "AUTO_POST"
min_trust = 0.85
summary = "Pełny konsensus — wszystkie warstwy zatwierdzają fakturę"
deliberation = "Warstwa kontekstowa, precyzji i anomalii — wszystkie APPROVE. Pełna zgodność, niskie ryzyko."

[matrices.validation_verdict.combinations.CONTEXT_ANOMALY_APPROVE]
alpha = "APPROVE"
beta = "REJECT"
gamma = "APPROVE"
level = "LEVEL_2_REVIEW"
action = "SUGGEST"
min_trust = 0.92
summary = "Warstwy kontekstowa i anomalii zatwierdzają, precyzja ma zastrzeżenia"
deliberation = "Warstwa kontekstowa i anomalii approve. Warstwa precyzji reject. Potencjalny problem z precyzją danych."

[matrices.validation_verdict.combinations.CONTEXT_PRECISION_APPROVE]
alpha = "APPROVE"
beta = "APPROVE"
gamma = "REJECT"
level = "LEVEL_2_REVIEW"
action = "SUGGEST"
min_trust = 0.90
summary = "Warstwy kontekstowa i precyzji zatwierdzają, anomalia wykryta"
deliberation = "Warstwa kontekstowa i precyzji approve. Warstwa anomalii reject. Potencjalna anomalia kwotowa."

[matrices.validation_verdict.combinations.CONTEXT_ONLY]
alpha = "APPROVE"
beta = "REJECT"
gamma = "REJECT"
level = "LEVEL_3_ESCALATE"
action = "ASK_USER"
min_trust = 0.0
summary = "Tylko warstwa kontekstowa zatwierdza — wymaga decyzji użytkownika"
deliberation = "Tylko warstwa kontekstowa APPROVE. Precyzja i anomalie REJECT. Znaczące rozbieżności."

[matrices.validation_verdict.combinations.PRECISION_ANOMALY_APPROVE]
alpha = "REJECT"
beta = "APPROVE"
gamma = "APPROVE"
level = "LEVEL_3_ESCALATE"
action = "ASK_USER"
min_trust = 0.0
summary = "Warstwy precyzji i anomalii zatwierdzają, kontekst odrzuca"
deliberation = "Warstwy precyzji i anomalii APPROVE. Kontekst REJECT. Perspektywa kontekstowa jest negatywna."

[matrices.validation_verdict.combinations.ANOMALY_ONLY]
alpha = "REJECT"
beta = "REJECT"
gamma = "APPROVE"
level = "LEVEL_3_ESCALATE"
action = "ASK_USER"
min_trust = 0.0
summary = "Tylko warstwa anomalii zatwierdza — wymaga decyzji użytkownika"
deliberation = "Tylko warstwa anomalii APPROVE. Kontekst i precyzja REJECT. Znaczące rozbieżności."

[matrices.validation_verdict.combinations.PRECISION_VETO]
alpha = "REJECT"
beta = "APPROVE"
gamma = "REJECT"
level = "LEVEL_4_BLOCK"
action = "BLOCK"
min_trust = 0.0
summary = "Tylko warstwa precyzji zatwierdza — blokada (precision veto)"
deliberation = "Tylko warstwa precyzji APPROVE. Kontekst i anomalie REJECT. Precision veto — walidacja precyzji nie jest wystarczająca. BLOKADA."

[matrices.validation_verdict.combinations.FULL_REJECT]
alpha = "REJECT"
beta = "REJECT"
gamma = "REJECT"
level = "LEVEL_4_BLOCK"
action = "BLOCK"
min_trust = 0.0
summary = "Wszystkie warstwy odrzucają — blokada"
deliberation = "Wszystkie warstwy REJECT. BLOKADA."

# Rozszerzona matryca: uwzględniająca błędy i timeouty
[matrices.validation_verdict.combinations.ALPHA_ERROR]
alpha = "ERROR"
beta = "APPROVE"
gamma = "APPROVE"
level = "LEVEL_2_REVIEW"
action = "SUGGEST"
min_trust = 0.80
summary = "Alpha timeout/error — decyzja na podstawie Beta i Gamma"
deliberation = "Alpha nie odpowiedziała. Beta i Gamma zatwierdzają. SUGGEST z niższym trust."

[matrices.validation_verdict.combinations.BETA_ERROR]
alpha = "APPROVE"
beta = "ERROR"
gamma = "APPROVE"
level = "LEVEL_2_REVIEW"
action = "SUGGEST"
min_trust = 0.80
summary = "Beta timeout/error — decyzja na podstawie Alpha i Gamma"
deliberation = "Beta nie odpowiedziała. Alpha i Gamma zatwierdzają. SUGGEST z niższym trust."

[matrices.validation_verdict.combinations.GAMMA_ERROR]
alpha = "APPROVE"
beta = "APPROVE"
gamma = "ERROR"
level = "LEVEL_2_REVIEW"
action = "SUGGEST"
min_trust = 0.90
summary = "Gamma timeout/error — decyzja na podstawie Alpha i Beta"
deliberation = "Gamma nie odpowiedziała. Alpha i Beta zatwierdzają. SUGGEST."

[matrices.validation_verdict.combinations.DOUBLE_ERROR]
alpha = "ERROR"
beta = "ERROR"
gamma = "APPROVE"
level = "LEVEL_3_ESCALATE"
action = "ASK_USER"
min_trust = 0.0
summary = "Dwie warstwy z błędem — wymaga decyzji użytkownika"
deliberation = "Tylko Gamma odpowiedziała. Znaczące problemy techniczne. ASK_USER."

[matrices.validation_verdict.combinations.ALL_ERROR]
alpha = "ERROR"
beta = "ERROR"
gamma = "ERROR"
level = "LEVEL_4_BLOCK"
action = "BLOCK"
min_trust = 0.0
summary = "Wszystkie warstwy z błędem — blokada bezpieczeństwa"
deliberation = "Wszystkie warstwy z błędem. Krytyczny problem systemowy. BLOKADA."

# =============================================================================
# PROGI DECYZYJNE (rozszerzone)
# =============================================================================

[thresholds]
description = "Domyślne progi decyzyjne i wagi trust score — v2.0"

[thresholds.default]
auto_post = 0.92
suggest = 0.75
ask_user = 0.50

[thresholds.extended]
description = "Rozszerzone progi dla specyficznych scenariuszy"
new_vendor_auto_post_prohibited = true  # Nigdy AUTO_POST dla nowego kontrahenta
high_amount_block = 50000  # PLN — powyżej tej kwoty wymuszona pełna weryfikacja
fast_path_min_confidence = 0.92  # Min confidence dla fast-path (Alpha fast-path)
ledger_unavailable_penalty = 0.05  # Podwyższenie progu gdy TigerBeetle niedostępny

[thresholds.weights]
ai_confidence = 0.30
vendor_reliability = 0.25
data_consistency = 0.20
context_trust = 0.10
risk_guard = 0.15

[thresholds.adaptation]
enabled = true
learning_rate = 0.05
low_amount_threshold = 500.0  # PLN

[thresholds.category_adjustments]
recurring_categories = ["paliwo", "czynsz", "media", "telekomunikacja", "leasing"]
recurring_auto_post_adjustment = -0.025
recurring_suggest_adjustment = -0.015

problematic_categories = ["usługi it", "doradztwo", "marketing", "szkolenia"]
problematic_auto_post_adjustment = 0.05
problematic_suggest_adjustment = 0.025

[thresholds.vendor_adjustments]
known_vendor_auto_post_adjustment = -0.05
known_vendor_suggest_adjustment = -0.025
new_vendor_auto_post_adjustment = 0.10
new_vendor_suggest_adjustment = 0.05

[thresholds.amount_adjustments]
low_amount_auto_post_adjustment = -0.025
low_amount_suggest_adjustment = -0.015
high_amount_auto_post_adjustment = 0.10
high_amount_suggest_adjustment = 0.05
medium_amount_auto_post_adjustment = 0.025
medium_amount_suggest_adjustment = 0.015

# =============================================================================
# PROTOKOŁY AWARYJNE (rozszerzone)
# =============================================================================

[emergency]
description = "Protokoły awaryjne na wypadek błędów, timeoutów i nieoczekiwanych sytuacji"

[emergency.protocols.model_timeout]
condition = "Model nie odpowiedział w ciągu timeout_seconds"
action = "ASYNC_FALLBACK"
fallback_strategy = "Użyj statycznej matrycy decyzyjnej (DECISION_MATRIX) zamiast modelu"
logging = "Zaloguj timeout i kontynuuj z fallbackiem"
notify_user = false

[emergency.protocols.model_error]
condition = "Model zwrócił błąd lub niepoprawny JSON"
action = "PARSE_FALLBACK"
fallback_strategy = "Użyj regex fallback do wyciągnięcia JSON z odpowiedzi"
max_retries = 1
logging = "Zaloguj błąd parsowania"
notify_user = false

[emergency.protocols.model_crash]
condition = "Model wielokrotnie nie odpowiada lub aplikacja crashuje"
action = "SAFE_DEFAULT"
fallback_strategy = "Użyj domyślnych wartości (ESCALATE / BLOCK) i eskaluj do człowieka"
max_retries = 0
logging = "Zaloguj krytyczny błąd modelu"
notify_user = true

[emergency.protocols.unknown_voting_pattern]
condition = "Nieznana kombinacja głosów (Alpha, Beta, Gamma)"
action = "SAFE_ESCALATE"
fallback_strategy = "ASK_USER — bezpieczna eskalacja"
logging = "Zaloguj nieznany wzorzec głosowania"
notify_user = true

[emergency.protocols.workflow_timeout]
condition = "WorkflowPlanner nie odpowiedział w czasie"
action = "FULL_WORKFLOW"
fallback_strategy = "Uruchom pełny zestaw agentów (bezpieczna domyślna)"
logging = "Zaloguj timeout WorkflowPlanner"
notify_user = false

[emergency.protocols.validation_layer_timeout]
condition = "Jedna z warstw walidacji (Alpha/Beta/Gamma) nie odpowiedziała w czasie"
action = "SKIP_LAYER"
fallback_strategy = "Pomiń warstwę która timeoutowała i kontynuuj z ERROR jako głosem"
logging = "Zaloguj timeout warstwy walidacji"
notify_user = false

[emergency.protocols.rag_source_failure]
condition = "Jedno ze źródeł RAG (SQLite/DuckDB/sqlite-vec/TigerBeetle) nie odpowiada"
action = "ISOLATE_AND_CONTINUE"
fallback_strategy = "Pomiń źródło które nie odpowiada i kontynuuj z pozostałymi danymi"
logging = "Zaloguj awarię źródła RAG jako warning"
notify_user = false
impact = "Brakujące dane źródłowe oznaczane w FactSheet.sources_available"

[emergency.protocols.data_integrity_violation]
condition = "Dane z różnych źródeł są ze sobą sprzeczne (np. inny NIP w SQLite i DuckDB)"
action = "PREFER_SQLITE"
fallback_strategy = "Preferuj dane z SQLite (źródło prawdy dla transakcji), oznacz niespójność"
logging = "Zaloguj niespójność danych między źródłami"
notify_user = true
severity = "medium"

[emergency.protocols.model_oom]
condition = "Model zwrócił błąd OutOfMemory (OOM) podczas inferencji"
action = "FALLBACK_TO_SMALLER"
fallback_strategy = "Użyj statycznej matrycy decyzyjnej zamiast modelu"
max_retries = 0
logging = "Zaloguj OOM i kontynuuj bez modelu"
notify_user = true

# =============================================================================
# SCENARIUSZE BRZEGOWE — definicje dla testów i walidacji
# =============================================================================

[edge_cases]
description = "Zdefiniowane scenariusze brzegowe dla testów systemu"

[edge_cases.ocr_low_confidence]
condition = "OCR confidence < 0.5"
expected_behavior = "Wymuś kompletną ścieżkę (complex), nie ufaj żadnemu polu"
override = "Wszystkie pola faktury oznaczone jako 'low_confidence' — model nie może AUTO_POST"

[edge_cases.duplicate_invoice]
condition = "Gamma zwróciła is_duplicate=true"
expected_behavior = "BLOCK — nie księguj duplikatu"
override = "Nawet jeśli Alpha i Beta APPROVE, Gamma REJECT z duplikatem → BLOCK"

[edge_cases.partial_data]
condition = "Tylko 2 z 4 źródeł RAG dostępne"
expected_behavior = "Kontynuuj z dostępnymi danymi, podnieś próg confidence o 0.03"
override = "Nie blokuj decyzji z powodu braku danych — po prostu bądź bardziej ostrożny"

[edge_cases.nip_checksum_error]
condition = "NIP nie przechodzi walidacji sumy kontrolnej"
expected_behavior = "BLOCK — nie księguj faktury z błędnym NIP-em"
override = "Nawet jeśli wszystkie warstwy APPROVE, błąd NIP → BLOCK"

[edge_cases.negative_amount]
condition = "amount_gross < 0"
expected_behavior = "BLOCK — faktura z ujemną kwotą"
override = "Natychmiastowa blokada, nie uruchamiaj żadnych agentów"

[edge_cases.currency_mismatch]
condition = "Waluta faktury różni się od waluty kontrahenta w bazie"
expected_behavior = "ASK_USER — zapytaj użytkownika o właściwą walutę"
override = "Nie zgaduj — pokaż użytkownikowi obie waluty"

# =============================================================================
# PROTOKOŁY — DLA ANALYTICS AGENT (Hrida → Qwen → Fin-RWKV)
# =============================================================================

[protocols.analytics]
description = "Analytics Agent — sekwencyjny przepływ analityczny Hrida → Qwen → Fin-RWKV"

[protocols.analytics.hrida]
description = "Stage 1: Hrida-T2SQL-128k — generowanie zapytań SQL do DuckDB"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["queries"]

[protocols.analytics.hrida.system_prompt]
role = "Jesteś Hrida-T2SQL-128k — ekspert SQL generujący zapytania do DuckDB."
task = "Na podstawie kontekstu faktury wygeneruj 1-3 zapytania SQL do analizy finansowej."
checks = [
    "Generuj tylko zapytania SELECT — nigdy INSERT/UPDATE/DELETE",
    "Używaj tylko tabel oltp.invoices i oltp.vendors",
    "Każde zapytanie musi mieć określony cel (purpose)",
]

[protocols.analytics.qwen]
description = "Stage 2: Qwen2.5-1.5B-Instruct — analiza trendów i anomalii"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["trends", "anomalies"]

[protocols.analytics.qwen.system_prompt]
role = "Jesteś Qwen2.5-1.5B-Instruct — agent analityki finansowej."
task = "Analizuj dane faktur, wykrywaj trendy i anomalie, generuj podsumowania."
checks = [
    "Wykrywaj trendy: monthly_spend, vendor_concentration, category_shift",
    "Anomalie: amount_spike, new_vendor, zero_or_negative_amount",
    "Jeśli wykryjesz anomalię, ustaw needs_further_analysis=true",
]

[protocols.analytics.fin_rwkv]
description = "Stage 3: Fin-RWKV-169M — recenzja analizy i końcowy scoring"
output_format = "schema.output_formats.validation_verdict"
additional_fields = ["corrected_anomalies"]

[protocols.analytics.fin_rwkv.system_prompt]
role = "Jesteś Fin-RWKV-169M — recenzent analizy finansowej."
task = "Otrzymujesz wstępną analizę z Qwen2.5. Dokonaj końcowej weryfikacji i scoringu."
checks = [
    "Skoryguj ewentualne błędy w analizie Qwen",
    "Oceń końcowe ryzyko: risk_score 0.0-1.0",
    "Zarekomenduj akcję: auto_post | review | escalate",
]

