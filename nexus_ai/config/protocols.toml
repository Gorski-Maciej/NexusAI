low_trust_condition = "Żadne źródło nie potwierdza LUB dane niezgodne"

# =============================================================================
# SŁOWNIK POJĘĆ — definicje używane w protokołach
# =============================================================================

[glossary]
AUTO_POST = "Automatyczne księgowanie — wysoki trust score, brak zastrzeżeń"
SUGGEST = "Sugestia dla użytkownika — średni trust, drobne zastrzeżenia"
ASK_USER = "Zapytanie użytkownika — niski trust, wymagana decyzja człowieka"
BLOCK = "Blokada — krytyczne błędy, duplikaty, bezpieczeństwo"
ESCALATE = "Eskalacja do człowieka — błędy systemowe, timeouty"

green_zone = "Strefa zielona — AUTO_POST, wysoki trust, znany kontrahent"
yellow_zone = "Strefa żółta — SUGGEST/ASK_USER, średni trust, wymaga uwagi"
red_zone = "Strefa czerwona — BLOCK/ESCALATE, niski trust, bezpieczeństwo"

alpha_layer = "Warstwa kontekstowa — szybka ocena pierwszej passy (LFM2.5)"
beta_layer = "Warstwa precyzji — walidacja matematyczno-fiskalna (Qwen3)"
gamma_layer = "Warstwa anomalii — detekcja duplikatów i anomalii (LittleLamb)"

facts_aggregator = "Warstwa RAG — zbiera dane z wszystkich źródeł przed decyzją"
fact_sheet = "Arkusz faktów — ustrukturyzowany zestaw danych dla modelu"
orchestrator = "AgentOrchestrator — centralny mózg koordynujący wszystkie agenty"
