[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-crypto"
version = "0.1.0"
description = "NexusAI Cryptographic Module (Pure Python Fallback)"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.0",
    "pyjwt>=2.8",
]

[tool.setuptools.packages.find]
include = ["nexus_crypto*"]
