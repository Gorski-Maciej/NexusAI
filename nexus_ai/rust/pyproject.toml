[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "nexus-crypto"
version = "0.4.0"
description = "NexusAI custom crypto module — Rust+PyO3 native extension (ABI3, strip, pyo3-log)"
# ABI3-py312: wheel działa na Python ≥3.12 (3.12, 3.13, 3.13t)
# Root pyproject.toml wymaga ≥3.13, ale ABI3 wheel jest celowo
# bardziej kompatybilny — jedno koło dla wszystkich >=3.12
requires-python = ">=3.12"

[tool.maturin]
module-name = "nexus_crypto._core"
# ABI3 — jeden wheel dla Python ≥3.12 (3.12, 3.13, 3.13t)
# Bez ABI3: osobne koła dla każdej wersji Pythona
# Ze strip: usunięte symbole debug → 30-40% mniejszy .whl
features = ["pyo3/extension-module"]
compatibility = "linux"
strip = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
exclude = [
    "target/**",
]
