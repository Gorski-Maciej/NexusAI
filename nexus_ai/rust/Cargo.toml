[package]
name = "nexus-crypto"
version = "0.4.0"
edition = "2021"
description = "NexusAI — custom crypto module (AEAD, Argon2id, SHA-256) in Rust + PyO3"
# Pojedynczy wheel na Python ≥3.12 (ABI3 stable ABI)
rust-version = "1.78"

[lib]
name = "nexus_crypto"
crate-type = ["cdylib", "lib"]

[dependencies]
# PyO3 z ABI3 (stable ABI) — jeden wheel na Python ≥3.12
# Działa na Python 3.12, 3.13, 3.13t bez rekompilacji
pyo3 = { version = "0.22", features = ["extension-module", "experimental-inspect", "abi3-py312"] }
pyo3-log = "0.11"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
blake2 = "0.10"
rand = "0.9"
hex = "0.4"
zeroize = "1"
hmac = "0.12"
log = "0.4"
rust_decimal = "1.36"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
quick-xml = "0.36"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rayon = "1.10"
libc = "0.2"
# mimalloc — global allocator for Rust (5-15% less RAM, secure mode)
# secure: guard pages + encrypted free lists + randomized allocation
# Zgodnie z aa3fvcx.txt: Microsoft mimalloc, statycznie wkompilowany
mimalloc = { version = "0.1", features = ["secure"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tax_math"
harness = false

[[bench]]
name = "rules_engine"
harness = false

[[bench]]
name = "secure"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
