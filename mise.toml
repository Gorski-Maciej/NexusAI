[tasks.mypyc-optimize-db]
description = "🧬 Kompilacja mypyc — tylko db/"
run = "uv run mypyc nexus_ai/db"

[tasks.mypyc-optimize-tax-strict]
description = "🧬 Kompilacja mypyc --strict z disallow_untyped_defs — tylko tax/"
run = "uv run mypyc --strict --disallow-untyped-defs nexus_ai/tax"

[tasks.build-rust-release]
description = "Skompiluj nexus-crypto (koło binarne .whl)\n  --strip: usuwa symbole debug → 30-40% mniejszy .whl\n  ABI3: jeden wheel na Python ≥3.12 (3.12, 3.13, 3.13t)"
run = "cd nexus_ai/rust && maturin build --release --strip"

[tasks.build-nuitka]
description = "Skompiluj aplikację do samodzielnego .exe (Nuitka)"
run = "python -m nuitka --project-name=nexus-ai main.py"

[tasks.build-nuitka-fast]
description = "Szybki build (standalone folder, niska pamięć)"
run = "python -m nuitka --project-name=nexus-ai --mode=standalone --low-memory main.py"

[tasks.build-all]
description = "Skompiluj wszystko: Rust (PyO3) + Nuitka (standalone .exe)"
depends = ["build-rust", "build-nuitka"]
run = "echo '✓ All builds complete'"

# ── Testowanie ───────────────────────────────────────────────────────────────

[tasks.test]
description = "Uruchom testy (szybko — zatrzymaj przy pierwszym błędzie)"
run = "uv run pytest -x -v --timeout=30"
# Użycie z argumentami: mise run test -- --coverage  →  pytest -x -v --timeout=30 --coverage
# Argumenty po -- są automatycznie dołączane do komendy

[tasks.test-all]
description = "Uruchom wszystkie testy (nie zatrzymuj przy błędzie)"
run = "uv run pytest -v --timeout=30"
# Użycie: mise run test-all -- -k 'test_facts' --coverage

[tasks.test-coverage]
description = "Testy z raportem pokrycia kodu"
run = "uv run pytest --cov=nexus_ai --cov-report=term-missing"

[tasks.test-parallel]
description = "Testy równoległe na wszystkich rdzeniach CPU"
run = "uv run pytest -x -v -n auto --timeout=30"

[tasks.test-watch]
description = "Auto-uruchom testy przy zmianie plików"
watch = ["nexus_ai/**/*.py", "tests/**/*.py"]
run = "uv run pytest -x -v --timeout=30"

# ── Lint / Format / Typecheck ────────────────────────────────────────────────

[tasks.lint]
description = "Sprawdź kod linterem Ruff"
run = "uv run ruff check nexus_ai/"

[tasks.format]
description = "Auto-formatuj kod Python przez Ruff"
run = "uv run ruff format nexus_ai/"

[tasks.format-check]
description = "Sprawdź formatowanie bez modyfikacji"
run = "uv run ruff format --check nexus_ai/"

[tasks.typecheck]
description = "Sprawdź typy przez mypy"
run = "uv run mypy nexus_ai/"

[tasks.security-scan]
description = "Skanowanie bezpieczeństwa (Semgrep SAST) — tryb łagodny"
run = "uv run python -m nexus_ai.scripts.security_scan --target http://localhost:8000 --skip-zap --policy lenient"

[tasks.security-scan-strict]
description = "Skanowanie bezpieczeństwa (tryb ścisły — 0 high, 0 medium)"
run = "uv run python -m nexus_ai.scripts.security_scan --target http://localhost:8000 --skip-zap --policy strict"

# ── Migracje bazy danych — SUPERMOCE Alembic ──────────────────────────────
# Wszystkie taski używają konfiguracji z pyproject.toml [tool.alembic]
# env.py odczytuje URL bazy z AppConfig w runtime

[tasks.migrate]
description = "Wykonaj migracje bazy danych (Alembic upgrade head)"
run = "uv run alembic upgrade head"

[tasks.migrate-new]
description = "Wygeneruj nową migrację (podaj opis: mise run migrate-new 'dodaj_pole')"
run = "uv run alembic revision --autogenerate -m"

[tasks.migrate-check]
description = "SUPERMOC: Sprawdź czy są niezatwierdzone migracje (alembic check)\n  Uruchamiane w CI/CD przed deployem. Zwraca exit code 0 jeśli schema\n  jest zgodna z modelami, 1 jeśli są rozbieżności."
run = "uv run alembic check"

[tasks.migrate-current]
description = "SUPERMOC: Pokaż aktualną rewizję bazy"
run = "uv run alembic current"

[tasks.migrate-history]
description = "SUPERMOC: Pokaż historię migracji"
run = "uv run alembic history"

[tasks.migrate-stamp]
description = "SUPERMOC: Oznacz bazę jako będącą na konkretnej rewizji\n  Użycie: mise run migrate-stamp -- '0004'"
run = "uv run alembic stamp"

[tasks.migrate-downgrade]
description = "SUPERMOC: Cofnij ostatnią migrację\n  Użycie: mise run migrate-downgrade -- '-1'\n  Dla konkretnej rewizji: mise run migrate-downgrade -- '0003'"
run = "uv run alembic downgrade"

[tasks.migrate-fresh]
description = "SUPERMOC: Odśwież bazę od zera (drop + create all)\n  Uwaga: Niszczy wszystkie dane! Używaj tylko w dev."
run = "uv run alembic downgrade base && uv run alembic upgrade head"

[tasks.migrate-sql]
description = "SUPERMOC: Generuj SQL offline dla migracji (bez łączenia z DB)\n  Przydatne do audytu przed wdrożeniem produkcyjnym."
run = "uv run alembic upgrade head --sql"

[tasks.migrate-ci]
description = "SUPERMOC: CI/CD — sprawdź migracje + sanity\n  Uruchamiane w pipeline CI. Sprawdza:\n  1. Czy wszystkie modele są zgodne z DB (alembic check)\n  2. Czy migracje są na head\n  3. Loguje rewizję"
run = """
echo '🔍 Alembic CI/CD Check'
echo '======================'
echo ''
echo '1. Checking migration status...'
uv run alembic check && echo '  ✅ Schema is in sync' || echo '  ❌ Schema drift detected!'
echo ''
echo '2. Current revision:'
uv run alembic current
echo ''
echo '3. Migration history:'
uv run alembic history --verbose
echo ''
echo '✅ Alembic CI/CD check complete'
"""

# ── Modele AI ────────────────────────────────────────────────────────────────

[tasks.download-models]
description = "Pobierz wszystkie modele AI (GGUF)"
run = "uv run python -m nexus_ai.scripts.download_models"

[tasks.check-models]
description = "Sprawdź obecność modeli AI"
run = "uv run python -m nexus_ai.scripts.download_models --check"

[tasks.compute-checksums]
description = "Oblicz sumy SHA-256 dla modeli"
run = "uv run python -m nexus_ai.scripts.download_models --verify-only"

[tasks.check-updates]
description = "Sprawdź dostępność aktualizacji"
run = "uv run python -m nexus_ai.scripts.download_models --check-updates"

# ── Czyszczenie ──────────────────────────────────────────────────────────────

[tasks.clean]
description = "Wyczyść artefakty builda"
run = "rm -rf build/ dist/ *.egg-info/ .pytest_cache/ .mypy_cache/ __pycache__/"

[tasks.clean-all]
description = "Wyczyść wszystko (łącznie z danymi aplikacji)"
run = "rm -rf build/ dist/ *.egg-info/ .pytest_cache/ .mypy_cache/ __pycache__/ app_data/"

# ── Seed data ────────────────────────────────────────────────────────────────

[tasks.seed]
description = "Załaduj dane demo/seed"
run = "python main.py --load-fixtures"

[tasks.shell]
description = "Aktywuj shell w środowisku pixi"
run = "$SHELL"

# ── Profiling (py-spy) — diagnostyka wydajnościowa

[tasks.profile]
description = "Profiluj proces (py-spy record — flamegraph SVG)"
run = "uv run python -m nexus_ai.scripts.profiler"

[tasks.profile-dump]
description = "Zrzut stosu procesu (py-spy dump)"
run = "uv run python -m nexus_ai.scripts.profiler --dump"

[tasks.profile-top]
description = "Top-like widok funkcji (py-spy top)"
run = "uv run python -m nexus_ai.scripts.profiler --top"

[tasks.profile-check]
description = "Sprawdz czy py-spy jest dostepny"
run = "uv run python -m nexus_ai.scripts.profiler --check"

# ── pixi Environment Manager — zarządzanie środowiskiem pixi
 ───────────────

[tasks.pixi-info]
description = "📊 Diagnostyka środowiska pixi — cache, pakiety, platformy"
run = "pixi info"

[tasks.pixi-tree]
description = "🌳 Drzewo zależności pixi — debugowanie wersji pakietów"
run = "pixi tree"

[tasks.pixi-clean]
description = "🧹 Wyczyść cache pixi — force fresh install"
run = "pixi clean"

[tasks.pixi-exec]
description = """
⚡ Uruchom narzędzie w ad-hoc środowisku pixi (bez instalacji)

Użycie:
  mise run pixi-exec -- --spec ruff ruff check .
  mise run pixi-exec -- --spec pytest pytest -x -v
"""
run = "pixi exec"

# ── Single-file Scripts (PEP 723) — samowystarczalne skrypty ─────────────────

[tasks.rates]
description = "💱 Pobierz kursy walut z NBP (PEP 723 single-file script)"
run = "uv run scripts/fetch_currency_rates.py"

[tasks.rates-json]
description = "💱 Pobierz kursy walut w formacie JSON"
run = "uv run scripts/fetch_currency_rates.py --json"

# ── uv Package Manager ────────────────────────────────────────────────────────

[tasks.uv-sync]
description = "Synchronizuj środowisko Python przez uv (alternatywa dla pixi)"
run = "uv sync"

[tasks.uv-lock]
description = "Generuj/aktualizuj uv.lock — deterministyczny lockfile"
run = "uv lock"

[tasks.uv-export]
description = "Eksportuj uv.lock do requirements.txt"
run = "uv export --format requirements-txt -o requirements.txt"

[tasks.uv-cache-clean]
description = "Wyczyść globalny cache uv"
run = "uv cache clean"

[tasks.uv-upgrade]
description = "Aktualizuj uv do najnowszej wersji"
run = "uv self update"

# ── Deploy / Release ────────────────────────────────────────────────────────

[tasks.deploy]
description = "🚀 Wdrożenie produkcyjne: testy → build → migracje → restart"
depends = ["test", "build-all", "migrate"]
run = """
  echo '🚀 All steps passed — restarting services...'
  mise run restart-api
  mise run restart-worker
  echo '✅ Deployment complete'
"""

[tasks.deploy-quick]
description = "⚡ Szybkie wdrożenie (bez testów i Nuitka): build Rust → migracje → restart"
depends = ["build-rust-release", "migrate"]
run = """
  echo '⚡ Quick deploy — restarting services...'
  mise run restart-api
  echo '✅ Quick deploy complete'
"""

[tasks.deploy-check]
description = "🔍 Suchy przebieg wdrożenia — sprawdź co zostanie wykonane"
run = """
echo '📋 Dry run: test -> build-all -> migrate -> restart-api + restart-worker'
echo '   Run: MISE_ENV=prod mise run deploy'
echo '   Or:  MISE_ENV=prod mise run deploy-quick'
"""

[tasks.restart-api]
description = "Restart serwera API (Granian)"
run = """
  if systemctl is-active --quiet nexus-api 2>/dev/null; then
    sudo systemctl restart nexus-api
    echo '✅ API restarted (systemd)'
  elif [ -f /tmp/nexus-api.pid ]; then
    kill "$(cat /tmp/nexus-api.pid)" 2>/dev/null || true
    echo '✅ API process killed (PID file)'
  else
    echo '⚠️  No running API process found — start with: mise run api'
  fi
"""

[tasks.restart-worker]
description = "Restart workera Taskiq"
run = """
  if systemctl is-active --quiet nexus-worker 2>/dev/null; then
    sudo systemctl restart nexus-worker
    echo '✅ Worker restarted (systemd)'
  elif [ -f /tmp/nexus-worker.pid ]; then
    kill "$(cat /tmp/nexus-worker.pid)" 2>/dev/null || true
    echo '✅ Worker process killed (PID file)'
  else
    echo '⚠️  No running worker process found — start with: mise run worker'
  fi
"""

[tasks.status]
description = "Status serwisów produkcyjnych"
run = """
  echo '── NexusAI Service Status ──'
  for svc in nexus-api nexus-worker nats-server tigerbeetle; do
    if systemctl is-active --quiet "$svc" 2>/dev/null; then
      echo "  ✅ $svc — active (systemd)"
    elif pgrep -x "$svc" &>/dev/null; then
      echo "  ✅ $svc — running (PID: $(pgrep -x "$svc" | head -1))"
    else
      echo "  ⬜ $svc — not running"
    fi
  done
"""

[tasks.rollback]
description = "⏪ Cofnij ostatnie wdrożenie (git revert HEAD) — z potwierdzeniem"
run = """
  echo '⚠️  Ostatnie 5 commitów:'
  git log --oneline -5
  echo ''
  read -p 'Cofnąć HEAD? [y/N] ' confirm
  if [ "$confirm" = "y" ] || [ "$confirm" = "Y" ]; then
    git revert HEAD --no-edit
    echo '✅ Revert complete. Run: MISE_ENV=prod mise run deploy'
  else
    echo 'Rollback anulowany.'
  fi
"""
