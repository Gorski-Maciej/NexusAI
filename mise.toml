# ═══════════════════════════════════════════════════════════════════════════════
# mise.toml — NexusAI Version, Task, and Environment Manager
# ═══════════════════════════════════════════════════════════════════════════════
#
# mise (dawniej rtx) to ultra-lekki, napisany w Rust menedżer wersji, task
# runner i environment manager. Zastępuje: pyenv, asdf, make, just, direnv,
# dotenv.
#
# Instalacja:
#   curl https://mise.run | sh
#   mise install                              # Pobiera wszystkie zdefiniowane narzędzia
#
# Użycie:
#   mise run dev                              # Uruchom środowisko deweloperskie
#   mise run test -- --coverage               # Uruchom testy z parametrami
#   mise x -- python                          # Uruchom Python w środowisku mise
#   mise exec nats-server@2.10 -- nats-server  # Uruchom narzędzie w określonej wersji
#
# ── Hierarchia konfiguracji ─────────────────────────────────────────────────
#
# mise ładuje konfiguracje w następującej kolejności (późniejszy nadpisuje
# wcześniejszy). Użyj zmiennej środowiskowej MISE_ENV do przełączania między
# środowiskami:
#
#   MISE_ENV=prod mise run api                 # API w produkcji
#   MISE_ENV=prod mise run migrate             # Migracje w produkcji
#   MISE_ENV=dev  mise run dev                 # Dev (domyślnie)
#
#   Kolejność ładowania:
#     1. mise.toml         (bazowa, commitowana)
#     2. mise.{MISE_ENV}.toml  (środowiskowa, np. mise.prod.toml)
#     3. mise.local.toml   (lokalna, gitignorowana — najwyższy priorytet)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ── Ustawienia mise ───────────────────────────────────────────────────────────
[settings]
jobs = 4                         # Maksymalnie 4 równoległe instalacje/downloady
trusted_config_paths = ["/"]   # Ufaj wszystkim configom (projekt lokalny)

# ── Narzędzia (runtimes + binarki systemowe) ─────────────────────────────────
[tools]
python = "3.13"                  # Python ≥3.13 (free-threaded)
rust = "latest"                  # Rust toolchain dla PyO3/Maturin
"nats-server" = "2.10"           # NATS JetStream broker (~10 MB)
"tigerbeetle" = "0.16"          # TigerBeetle ledger (Zig)

# ── Zmienne środowiskowe ──────────────────────────────────────────────────────
[env]
NEXUS_LOG_LEVEL = "info"
NEXUS_HOST = "127.0.0.1"
NEXUS_PORT = "8000"
NEXUS_DB_PATH = "{{config_root}}/app_data/nexus.db"
NEXUS_UNIX_SOCKET = "/tmp/nexus-api.sock"
NEXUS_WATCH_INTERVAL = "5"

# ── mimalloc — Microsoft memory allocator (5-15% mniej RAM) ──────────────────
# Zgodnie z aa3fvcx.txt: statycznie wkompilowany w Nuitkę, dynamicznie
# przez LD_PRELOAD w dev. Zmienne konfiguracyjne dla optymalnej wydajności.
# Uwaga: LD_PRELOAD jest ustawiany w pixi.toml [activation.env] dla środowiska pixi.
# Te zmienne są dostępne dla wszystkich procesów uruchomionych przez mise.
MIMALLOC_LARGE_OS_PAGES = "1"           # huge OS pages — mniej TLB misses
MIMALLOC_RESERVE_HUGE_OS_PAGES = "1"    # rezerwacja dla modeli AI
MIMALLOC_EAGER_COMMIT_DELAY = "0"       # eager commit — niskie latency
MIMALLOC_PAGE_RESET = "0"               # wyłącz page reset dla workerów
MIMALLOC_EAGER_COMMIT = "1"             # commituj od razu

# ── Aliasy powłoki (dostępne w katalogu projektu) ────────────────────────────
[shell_alias]
na = "mise run start-nats"
tb = "mise run start-tigerbeetle"
dv = "mise run dev"
ap = "mise run api"
wk = "mise run worker"
ts = "mise run test"
ta = "mise run test-all"
tc = "mise run test-coverage"
bd = "mise run build-all"
br = "mise run build-rust"
bn = "mise run build-nuitka"
mg = "mise run migrate"
us = "mise run uv-sync"
ul = "mise run uv-lock"
ue = "mise run uv-export"
uc = "mise run uv-cache-clean"
uu = "mise run uv-upgrade"
dp = "mise run deploy"
dq = "mise run deploy-quick"
dc = "mise run deploy-check"
st = "mise run status"

# ══════════════════════════════════════════════════════════════════════════════
# Tasks — definicje procesów (z DAG dependencies i description)
# ══════════════════════════════════════════════════════════════════════════════

[tasks]

# ── Uruchamianie serwisów ──────────────────────────────────────────────────

[tasks.start-nats]
description = "Uruchom NATS JetStream broker na porcie 4222"
run = "nats-server -p 4222 -js"

[tasks.start-tigerbeetle]
description = "SUPERMOC: Uruchom TigerBeetle ledger na UNIX socket (szybszy niż TCP)\n  Zgodnie z audytem: komunikacja przez UNIX socket = zero narzutu TCP/IP\n  Gniazdo: /tmp/nexus-tb.sock"
run = "tigerbeetle start --addresses=/tmp/nexus-tb.sock --cluster=0 data/tigerbeetle.bin"

[tasks.start-tigerbeetle-tcp]
description = "Uruchom TigerBeetle na TCP (port 3000) — dla zdalnego dostępu"
run = "tigerbeetle start --addresses=3000 --cluster=0 data/tigerbeetle.bin"

[tasks.format-tigerbeetle]
description = "Sformatuj plik danych TigerBeetle"
run = "tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development data/tigerbeetle.bin"

[tasks.download-binaries]
description = "Pobierz NATS Server i TigerBeetle (binarki systemowe)"
run = "python -m nexus_ai.scripts.setup_env"

# ── Środowisko deweloperskie ────────────────────────────────────────────────

[tasks.dev]
description = "Uruchom pełne środowisko: NATS + TigerBeetle + API + Worker"
depends = ["start-nats", "start-tigerbeetle"]
run = "python main.py --mode all"

[tasks.api]
description = "Uruchom tylko serwer API (Granian + Litestar — pełna konfiguracja)\n  Wykorzystuje server.py z backpressure, HTTP/2, metrics, proxy headers"
run = "python main.py --mode api"

[tasks.api-prod]
description = "Uruchom API w trybie produkcyjnym (Granian — 4 workers, RSS limit, respawn)\n  Ustaw MISE_ENV=prod dla konfiguracji produkcyjnej"
run = """
NEXUS_GRANIAN_WORKERS=4 \
NEXUS_GRANIAN_WORKER_MAX_RSS=1024 \
NEXUS_GRANIAN_WORKER_LIFETIME=86400 \
NEXUS_GRANIAN_RESPAWN=true \
NEXUS_GRANIAN_BACKPRESSURE=200 \
NEXUS_GRANIAN_HTTP2_MAX_STREAMS=512 \
NEXUS_GRANIAN_RUNTIME_THREADS=4 \
NEXUS_GRANIAN_RUNTIME_BLOCKING_THREADS=8 \
NEXUS_GRANIAN_METRICS=true \
NEXUS_GRANIAN_PID_FILE=/tmp/nexus-api.pid \
NEXUS_GRANIAN_PROCESS_NAME=nexus-api \
python main.py --mode api
"""

[tasks.api-metrics]
description = "📊 Podgląd metryk Granian (Prometheus)"
run = "curl -s http://127.0.0.1:9090/metrics | head -50"

[tasks.api-dev]
description = "Uruchom serwer API z hot-reload (Granian — wszystkie supermoce)\n  --backlog=2048, --backpressure=100, HTTP/2 auto, uvloop, access-log\n  --reload-ignore-dirs=.git,__pycache__,.pixi,node_modules"
run = "granian --reload --host 127.0.0.1 --port 8000 --backlog 2048 --backpressure 100 --http auto --loop uvloop --access-log --access-log-fmt '%(addr)s - %(method)s %(path)s %(status)d %(dt_ms).3f' --no-header-server --metrics --metrics-address 127.0.0.1 --metrics-port 9091 --reload-ignore-dirs .git --reload-ignore-dirs __pycache__ --reload-ignore-dirs .pixi --reload-ignore-dirs node_modules --reload-ignore-patterns '*.pyc' --reload-ignore-patterns '*.so' --reload-tick 200 nexus_ai.api.app:create_app"

[tasks.worker]
description = "Uruchom tylko worker Taskiq + NATS"
run = "python main.py --mode worker"

[tasks.desktop]
description = "Uruchom interfejs desktopowy (Flet)"
run = "uv run python -m nexus_ai.luz.main"

[tasks.nexus]
description = "NexusAI CLI — zarządzanie systemem"
run = "uv run python -m nexus_ai.scripts.nexus_cli"

[tasks.bootstrap]
description = "Inicjalizacja środowiska (pierwsze uruchomienie)"
run = "python main.py --mode bootstrap"

[tasks.doctor]
description = "Diagnostyka systemu — sprawdź wszystkie komponenty"
run = "uv run python -m nexus_ai.scripts.doctor"

# ── Build ────────────────────────────────────────────────────────────────────

[tasks.build-rust]
description = "Skompiluj nexus-crypto (Rust + PyO3) — tryb develop\n  \"--strip\" usuwa symbole debug → 30-40% mniejszy .whl\n  ABI3 (stable ABI) → jeden wheel na Python ≥3.12"
run = "cd nexus_ai/rust && maturin develop --release --strip"

[tasks.mypyc-optimize]
description = "🧬 Kompilacja mypyc — typowany Python → C (2-5× przyspieszenie)\n  Dla strict mode: mise run mypyc-optimize-tax"
run = "uv run mypyc nexus_ai/tax nexus_ai/core nexus_ai/services nexus_ai/db nexus_ai/events"

[tasks.mypyc-optimize-tax]
description = "🧬 Kompilacja mypyc --strict — tylko tax/ (krytyczna matematyka finansowa)"
run = "uv run mypyc --strict nexus_ai/tax"

[tasks.mypyc-optimize-core]
description = "🧬 Kompilacja mypyc — tylko core/"
run = "uv run mypyc nexus_ai/core"

[tasks.mypyc-optimize-services]
