<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reklama Wideo - Kiosk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    /* Komunikat gdy brak plikow */
    #message {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      background: #000;
      z-index: 10;
    }
    #message.show { display: flex; }
    #message h1 { font-size: 2.5rem; font-weight: 600; }
    #message p { font-size: 1.2rem; opacity: 0.7; max-width: 40ch; }
  </style>
</head>
<body>
  <!-- autoplay + muted: wymagane by przegladarka pozwolila grac bez klikniecia -->
  <video id="player" autoplay muted playsinline></video>

  <div id="message">
    <h1>Reklama Wideo</h1>
    <p id="status">Wczytywanie...</p>
  </div>

  <script>
    const player = document.getElementById("player");
    const message = document.getElementById("message");
    const status = document.getElementById("status");

    let playlist = [];
    let index = 0;

    async function fetchPlaylist() {
      try {
        const res = await fetch("/api/videos", { cache: "no-store" });
        return await res.json();
      } catch (err) {
        return [];
      }
    }

    function showMessage(text) {
      status.textContent = text;
      message.classList.add("show");
    }

    // Odtwarzaj kolejny plik; po koncu listy wracaj na poczatek (petla zamknieta)
    function playNext() {
      if (playlist.length === 0) return;
      index = index % playlist.length;
      player.src = playlist[index];
      player.play().catch(() => {});
      index++;
    }

    player.addEventListener("ended", playNext);

    // Uszkodzony / niezaladowany plik -> pomin po chwili
    player.addEventListener("error", () => {
      if (playlist.length > 0) setTimeout(playNext, 1000);
    });

    async function start() {
      playlist = await fetchPlaylist();

      if (playlist.length === 0) {
        showMessage("Brak plikow wideo. Wrzuc pliki do folderu videos/.");
        // Sprobuj ponownie az pojawia sie pliki
        setTimeout(start, 5000);
        return;
      }

      message.classList.remove("show");
      playNext();
    }

    // Auto-start zaraz po zaladowaniu strony (kiosk)
    start();
  </script>
</body>
</html>
