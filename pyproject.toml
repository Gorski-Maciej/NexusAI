[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4", "maturin>=1.5"]
build-backend = "hatchling.build"

# ═══════════════════════════════════════════════════════════════════════════════
# Hatchling Build Pipeline — nexus-ai jako centrum build orchestracji
# ═══════════════════════════════════════════════════════════════════════════════
#
# Wszystkie operacje build, test, deploy są dostępne przez `hatch run`:
#
#   hatch build              # Zbuduj koło (wheel) z maturin hook
#   hatch run ci             # Lint → Typecheck → Test
#   hatch run build-all      # Rust → Nuitka (onefile)
#   hatch run deploy         # CI → Build → Migracje → Restart
#
# Custom build hook dla Nuitka jest zdefiniowany w nexus_ai/build/hooks.py.
# Gdy hatchling znajdzie plugin na PYTHONPATH, użyje go automatycznie.
# W przeciwnym razie Nuitka jest uruchamiana przez hatch env scripts.
#
# ═══════════════════════════════════════════════════════════════════════════════


# ── pixi (prefix.dev) — all-in-one environment manager ──────────────────────
# pixi replaces Docker, conda, and manual system-dependency scripts.
# One pixi.toml defines: Python version (3.13t), PyPI packages, AND system deps.
# Install: curl -fsSL https://pixi.sh/install.sh | sh
#
# Quick start:
#   pixi install       # Create environment (Python 3.13t + all deps)
#   pixi run python    # Run in the isolated environment
#   pixi run pytest    # Run tests
#   pixi shell         # Activate shell inside the environment

# ── uv (Astral) — fastest PyPI package manager (built into pixi) ───────────
# uv is included inside pixi, but can also be used standalone:
#   uv pip install -r requirements.txt   # 10-100× faster than pip
#   uv venv                             # Create virtual env in milliseconds

[project]
name = "nexus-ai"
dynamic = ["version"]
description = "NexusAI — Ultralekki, autonomiczny system księgowy z AI"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "NexusAI Team" },
]

keywords = ["accounting", "ai", "ocr", "invoice", "fintech", "poland"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ═══════════════════════════════════════════════════════════════════════
    # API / ASGI — Litestar + Granian (Rust ASGI server, zastępuje Uvicorn)
    # ═══════════════════════════════════════════════════════════════════════
    "litestar>=2.8.0",
    "granian>=1.0.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Database — SQLModel (SQLAlchemy + Pydantic w jednym), sqlite-vec
    # ═══════════════════════════════════════════════════════════════════════
    "sqlmodel>=0.0.16",
    "sqlite-vec>=0.1.0",
    "alembic>=1.13.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Validation & Serialization — msgspec (ultraszybki, zastępuje json+orjson)
    # ═══════════════════════════════════════════════════════════════════════
    "msgspec>=0.18.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Async I/O — anyio (jednolita warstwa dla asyncio/trio)
    # ═══════════════════════════════════════════════════════════════════════
    "anyio>=4.4.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Task Queue / Messaging — Taskiq + NATS JetStream
    # ═══════════════════════════════════════════════════════════════════════
    "taskiq>=0.11.0",
    "taskiq-nats>=0.5.0",
    "nats-py>=2.6.0",

    # ═══════════════════════════════════════════════════════════════════════
    # HTTP / Networking — httpx + hishel (inteligentny cache HTTP)
    # ═══════════════════════════════════════════════════════════════════════
    "httpx>=0.27.0",
    "hishel>=0.1.0",
    "fsspec>=2024.3.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Resilience — stamina (async-native retry + circuit breaker)
    # Zastępuje: tenacity + pybreaker
    # ═══════════════════════════════════════════════════════════════════════
    "stamina>=0.1.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Cryptography — nexus-crypto (Rust + PyO3, własny moduł)
    # Zastępuje: cryptography (Fernet, PBKDF2, SHA-256)
    # ═══════════════════════════════════════════════════════════════════════
    "nexus-crypto>=0.1.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Litestar JWT (wbudowane — zero dodatkowych zależności)
    # ═══════════════════════════════════════════════════════════════════════
    "litestar[jwt]>=2.8.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Document / XML processing
    # ═══════════════════════════════════════════════════════════════════════
    "lxml>=5.1.0",
    "xsdata>=24.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.8.0",
    "surya-ocr>=0.4.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Analytics / OLAP — DuckDB + Polars (zastępuje pandas)
    # ═══════════════════════════════════════════════════════════════════════
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "polars>=1.0.0",

    # ═══════════════════════════════════════════════════════════════════════
    # LLM Inference — llama-cpp-python (GGUF, CPU/GPU)
    # ═══════════════════════════════════════════════════════════════════════
    "llama-cpp-python>=0.2.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Model Hub
    # ═══════════════════════════════════════════════════════════════════════
    "huggingface-hub>=0.23.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Logging — Loguru + structlog (ustrukturyzowane logowanie z kontekstem)
    # ═══════════════════════════════════════════════════════════════════════
    "loguru>=0.7.0",
    "structlog>=24.0.0",

    # ═══════════════════════════════════════════════════════════════════════
    # Metrics / Monitoring — OpenTelemetry (zastępuje prometheus_client)
    # ═══════════════════════════════════════════════════════════════════════
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-prometheus>=0.46b0",

    # ═══════════════════════════════════════════════════════════════════════
    # Utilities
    # ═══════════════════════════════════════════════════════════════════════
    "psutil>=5.9.0",
    "pendulum>=3.0.0",
    "numpy>=2.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.1.0",  # Natywna asynchroniczność na anyio (zamiast pytest-asyncio)
    "pytest-cov>=5.0.0",
    "crosshair>=0.1.0.dev0",  # Property-based testing z SMT solverem (tylko dev version on PyPI)
    "hypothesis>=6.100.0",  # Zachowany dla złożonych property-based tests (test_property_based.py)
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "schemathesis>=3.30.0",  # Automatyczny fuzz testing API ze schematu OpenAPI
    "locust>=2.29.0",        # Pythonowe testy wydajności (zamiast k6)
    "py-spy>=0.3.14",        # Natywny profiler w Rust, narzut <1%
    "sentry-sdk>=2.0.0",
]
ui = [
    "flet>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/Gorski-Maciej/NexusAI"
Documentation = "https://github.com/Gorski-Maciej/NexusAI/wiki"
Repository = "https://github.com/Gorski-Maciej/NexusAI"

[project.scripts]
nexus-api = "nexus_ai.api.server:run_backend"
nexus-worker = "nexus_ai.luz.worker:main"
nexus-desktop = "nexus_ai.luz.main:main"
nexus = "nexus_ai.scripts.nexus_cli:main"
nexus-build = "nexus_ai.build.hooks:main"            # Unified build CLI

# ── Hatchling build hook plugin registration ────────────────────────────────
# Rejestruje nexus_ai.build.hooks.NuitkaBuildHook jako plugin hatchling.
# Dzięki temu `[tool.hatch.build.hooks.nuitka]` w pyproject.toml jest aktywny.
# Uwaga: ten plugin jest aktywny tylko gdy nexus-ai jest zainstalowane
# w środowisku hatch (pip install -e .). W CI hatch tworzy środowisko
# virtualne, więc plugin jest dostępny.
[project.entry-points."hatch.build.hook"]
nuitka = "nexus_ai.build.hooks:NuitkaBuildHook"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
    "nexus_ai/",
    "nexus_crypto/",
]

[tool.hatch.build.targets.sdist]
packages = [
    "nexus_ai/",
]
exclude = [
    "nexus_ai/rust/target/**",
    "tests/**",
    "*.so",
    "*.pyd",
]

# ── Maturin — Rust/PyO3 native extensions ────────────────────────────────────
[tool.hatch.build.hooks.maturin]

[tool.hatch.build.hooks.maturin.metadata]
# Automatyczna kompilacja Rust przy każdym wheel build

# ── Nuitka — custom build hook (hatchling plugin) ────────────────────────────
# UWAGA: Ten hook jest aktywny TYLKO gdy nexus-ai jest zainstalowane
# (pip install -e .) — wtedy hatchling znajdzie plugin przez entry point.
# W CI, gdzie budujemy wheel od zera, hook jest pomijany (projekt nie jest
# jeszcze zainstalowany). Nuitka jest wtedy uruchamiana przez hatch env scripts:
#   hatch run build:build-nuitka
#
# Gdy plugin jest aktywny (pip install -e .), hatchling automatycznie
# wywołuje NuitkaBuildHook.finalize() po zbudowaniu koła, kompilując
# aplikację do standalone .exe.
#
# Opcje:
#   options.build-rust: czy budować Rust przed Nuitka (domyślnie true)
#   options.onefile:    czy tworzyć pojedynczy plik (domyślnie true)
#   options.target:     ścieżka wyjściowa (domyślnie dist/NexusAI)
#
[tool.hatch.build.hooks.nuitka]
[tool.hatch.build.hooks.nuitka.options]
build-rust = true
onefile = true


[tool.maturin]
module-name = "nexus_crypto._core"
manifest-path = "nexus_ai/rust/Cargo.toml"
# ABI3 (stable ABI) — jeden wheel na Python ≥3.12
# Strip — usuwa symbole debug, 30-40% mniejszy .whl
features = ["pyo3/extension-module"]
compatibility = "linux"
strip = true

# ── mypyc — compile typed Python to C (2-5× speedup) ─────────────────────────
# Phase 1: rozszerzony zakres kompilacji — włączone services/, db/, events/
# Wyłączone pliki z dynamicznymi importami (importlib, __import__) które mypyc
# nie może skompilować do C. Te pliki pozostają w interpreterze.
[tool.mypyc]
packages = [
    "nexus_ai/tax",
    "nexus_ai/core",
    "nexus_ai/services",
    "nexus_ai/db",
    "nexus_ai/events",
]
exclude = [
    # ── core: dynamiczne importy (__import__, importlib) ─────────────────
    "nexus_ai.core.__init__",
    "nexus_ai.core.plugins",
    "nexus_ai.core.tasks",
    "nexus_ai.core.logger",
    "nexus_ai.core.config",
    "nexus_ai.core.exporters.base",
    # ── db: dynamiczne importy (importlib) ────────────────────────────
    "nexus_ai.db.__init__",
    "nexus_ai.db.analytics_schema",
    "nexus_ai.db.migrations.*",
    # ── services: dynamiczne importy ───────────────────────────────────
    "nexus_ai.services.rules_engine",
    "nexus_ai.services.telemetry",
    # ── events: dynamiczne importy ─────────────────────────────────────
    "nexus_ai.events.__init__",
]
# mypyc compiles modules with strict type annotations to native C extensions.
# This gives 2-5× speedup for domain models, tax calculations, and audit logic.

# ── Strict mode dla krytycznych modułów ─────────────────────────────────────
# Uwaga: per-modułowe opcje mypyc wymagają notacji kropkowej (nie ścieżkowej)
# i są stosowane przez mypyc w trakcie kompilacji. Na razie strict mode
# włączony globalnie przez CLI flagi w taskach mise/hatch.

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# pytest-anyio: natywna asynchroniczność (anyio backend)
# Zastępuje pytest-asyncio — testy działają na anyio, tej samej warstwie co kod produkcyjny
# Uwaga: async test functions wymagają @pytest.mark.anyio lub pytestmark na poziomie modułu

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["nexus_ai/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = [
    "E501",   # Long lines — intentional for readability
    "N999",   # Invalid module name — project uses UPPERCASE dirs (API, DB, FRONTEND) deliberately
]

# ── Mypy (type checker) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false

# ── uv (Astral) — najszybszy menedżer pakietów PyPI ──────────────────────────
# uv jest wbudowany w pixi, ale może być używany samodzielnie:
#   uv sync              # Synchronizuj środowisko z uv.lock
#   uv lock              # Generuj/aktualizuj uv.lock
#   uv run pytest        # Uruchom testy w środowisku
#   uv export -o req.txt # Eksportuj lockfile do requirements.txt
#
# UWAGA: Dev dependencies są zdefiniowane w [project.optional-dependencies].dev
# (PEP 621) — to jest canonical source of truth. pixi używa własnej sekcji
# [feature.dev.pypi-dependencies] w pixi.toml dla zależności systemowych.
#
# Przykład użycia z uv:
#   uv sync --dev          # Instaluje dev z [project.optional-dependencies].dev
#   uv sync --group dev    # To samo, alias
#
[tool.uv.sources]
nexus-crypto = { path = "./nexus_ai/rust", editable = true }

# ── crosshair (property-based testing) ───────────────────────────────────────
# Zastępuje: hypothesis
# crosshair uses SMT-based static analysis to mathematically prove correctness
# instead of random fuzzing. It's faster, more deterministic, and lighter.
[tool.crosshair]
max_examples = 200

# ── hatch environments (dev scripts) ─────────────────────────────────────────
[tool.hatch.envs.lint]
dependencies = ["ruff>=0.3.0"]
scripts = { check = "ruff check nexus_ai/", fix = "ruff check --fix nexus_ai/" }

[tool.hatch.envs.typecheck]
dependencies = ["mypy>=1.8.0"]
scripts = { check = "mypy nexus_ai/" }

# ── Matrix testing: Python 3.13 (standard) + 3.13t (free-threaded, bez GIL) ──
[tool.hatch.envs.test]
dependencies = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.1.0",
    "pytest-cov>=5.0.0",
    "crosshair>=0.1.0.dev0",     # SMT-driven property testing
    "hypothesis>=6.100.0",       # Zachowany dla złożonych property-based tests
]
scripts = {
    run = "pytest -x -v --timeout=30",
    all = "pytest -v --timeout=30",
    cov = "pytest --cov=nexus_ai",
}

# Matrix: test na standardowym Python 3.13 i free-threaded 3.13t
# Uruchom: hatch run test:run        → Python 3.13 (domyślny)
#          hatch run test.3.13t:run  → Python 3.13t (free-threaded)
[[tool.hatch.envs.test.matrix]]
python = ["3.13", "3.13t"]

# ── Build env — Rust + Nuitka + mypyc ───────────────────────────────────────
# Używa nexus-build (CLI z nexus_ai/build/hooks.py) jako unified build tool.
# Wszystkie operacje build są dostępne przez jeden entry point:
#   hatch run build:build-all      → Rust + Nuitka
#   hatch run build:nuitka         → Tylko Nuitka
#   hatch run build:rust           → Tylko Rust
[tool.hatch.envs.build]
dependencies = ["maturin>=1.5", "mypyc>=1.8.0", "nuitka>=1.8"]
scripts = {
    # Unified przez nexus-build CLI
    build-all = "nexus-build build-all",
    build-rust = "nexus-build rust",
    build-rust-wheel = "nexus-build rust-wheel",
    build-nuitka = "nexus-build nuitka",
    build-nuitka-fast = "nexus-build nuitka-fast",
    
    # Legacy shell scripts (backward compat)
    legacy-build-rust = "cd nexus_ai/rust && maturin build --release",
    legacy-build-rust-dev = "cd nexus_ai/rust && maturin develop --release",
    legacy-build-nuitka = "python -m nuitka --project-name=nexus-ai main.py",
    legacy-build-nuitka-fast = "python -m nuitka --project-name=nexus-ai --mode=standalone --low-memory main.py",
    
    # Optymalizacja przez mypyc
    optimize = "uv run mypyc nexus_ai/tax nexus_ai/core",
}

# ── Dev env — pełny stack deweloperski ───────────────────────────────────────
[tool.hatch.envs.dev]
scripts = {
    api = "granian --reload --host 127.0.0.1 --port 8000 nexus_ai.api.app:create_app",
    worker = "uv run python main.py --mode worker",
    desktop = "uv run python -m nexus_ai.luz.main",
    migrate = "uv run alembic upgrade head",
    seed = "uv run python main.py --load-fixtures",
    doctor = "uv run python -m nexus_ai.scripts.doctor",
}

# ── Default env — unified build/CI/CD pipeline (dostępne przez `hatch run`) ────
# Wszystkie operacje są dostępne przez hatch — jeden interfejs do wszystkiego.
# Używa nexus-build CLI (nexus_ai/build/hooks.py) jako implementacji.
[tool.hatch.envs.default]
scripts = {
    # ── Dev ───────────────────────────────────────────────────────
    # Dev (Linux/macOS only — użyj dwóch terminali na Windows)
    dev = "hatch run dev:api & hatch run dev:worker",
    api = "hatch run dev:api",
    worker = "hatch run dev:worker",
    desktop = "hatch run dev:desktop",
    
    # ── Test + Lint + Typecheck (CI pipeline) ────────────────────
    ci = "nexus-build ci",
    ci-full = "nexus-build ci-full",
    lint = "hatch run lint:check",
    typecheck = "hatch run typecheck:check",
    test = "hatch run test:run",
    test-all = "hatch run test:all",
    test-cov = "hatch run test:cov",
    
    # ── Build ─────────────────────────────────────────────────────
    build-all = "nexus-build build-all",
    build-rust = "nexus-build rust",
    build-nuitka = "nexus-build nuitka",
    
    # ── Deploy ────────────────────────────────────────────────────
    # Full deploy: CI → Build → Migrate
    deploy = "nexus-build deploy",
    # Quick deploy: build Rust → migrate (bez testów i Nuitka)
    deploy-quick = "nexus-build deploy-quick",
    
    # ── Database ──────────────────────────────────────────────────
    migrate = "hatch run dev:migrate",
    seed = "hatch run dev:seed",
    
    # ── Clean ─────────────────────────────────────────────────────
    clean = "nexus-build clean",
}

# ── Alembic — database migrations (config in pyproject.toml, no alembic.ini) ────
# Zgodnie z aa3fvcx.txt: konfiguracja Alembic w pyproject.toml zamiast osobnego pliku.
# env.py odczytuje script_location i inne ustawienia z [tool.alembic].
# Fallback: jeśli sekcja nie istnieje, env.py używa własnych domyślnych ścieżek.
[tool.alembic]
script_location = "nexus_ai/db/migrations"
# sqlalchemy.url resolved at runtime by env.py via AppConfig — not hardcoded here
file_template = "%%(rev)s_%%(slug)s"
timezone = "UTC"
# Post-write hooks (formatting after autogenerate)
post_write_hooks = "ruff"
post_write_hooks_ruff_type = "console_scripts"
post_write_hooks_ruff_entrypoint = "ruff"
post_write_hooks_ruff_options = "check --fix"

# ── Release env — publikacja na PyPI + GitHub Releases ───────────────────────
# Uruchom: hatch run release:dry-run     (suchy przebieg)
#          hatch run release:build        (build + publish do PyPI)
#          hatch run release:github       (build + GitHub Release)
#
# UWAGA: `hatchling` to biblioteka Python (build backend).
# `hatch` to CLI narzędzie instalowane przez pipx — nie ma na PyPI jako dep.
[tool.hatch.envs.release]
dependencies = [
    "hatchling>=1.21",
    "hatch-vcs>=0.4",
    "maturin>=1.5",
    "nuitka>=1.8",
]
scripts = {
    # Suchy przebieg — pokaż co zostanie zrobione
    dry-run = "echo '📋 Release dry-run: hatch build → hatch publish → git tag vX.Y.Z'",
    
    # Build + publish do PyPI
    build = "hatch build",
    publish = "hatch publish",
    
    # Full release: build + publish + git tag
    full = "hatch build && hatch publish && git tag v$(hatch version)",
    
    # GitHub Release (wymaga gh CLI)
    github = "hatch build && gh release create v$(hatch version) dist/*.whl dist/*.tar.gz --generate-notes",
}


# ── Nuitka — compile Python to standalone .exe (single file) ─────────────────
# Zgodnie z aa3fvcx.txt: Nuitka kompiluje całą aplikację z wszystkimi
# zależnościami do pojedynczego pliku .exe z wkompilowanym mimalloc.
#
# Build command:
#   nuitka --project-name=nexus-ai main.py
#   # OR equivalently from pyproject.toml config:
#   python -m nuitka --project-name=nexus-ai main.py
#
# For Windows installer build:
#   python -m nuitka --project-name=nexus-ai main.py
#   iscc build_scripts/setup.iss
#
[tool.nuitka]
# ── Core build options ───────────────────────────────────────────────────
onefile = true                  # Pojedynczy plik .exe (nie folder)
standalone = true               # Samodzielny, bez zależności systemowych

# ── Plugins ──────────────────────────────────────────────────────────────
enable-plugin = [
    "pydantic",                  # Obsługa Pydantic/SQLModel
    "numpy",                     # Obsługa NumPy
    "anti-bloat",                # Usuwa zbędny kod z bibliotek
    "mimalloc",                  # Microsoft mimalloc — 5-15% mniej RAM
    "multiprocessing",           # Obsługa procesów potomnych
    "trio",                      # Obsługa anyio/trio
]

# ── Data inclusion (wszystkie potrzebne pliki) ───────────────────────────
include-package = [
    "nexus_ai",                  # Cały pakiet aplikacji
    "nexus_crypto",              # Natywny moduł Rust+PyO3 (budowany przez maturin z nexus_ai/rust/)
    "granian",                   # ASGI server Rust
    "litestar",                  # API framework
    "sqlmodel",                  # ORM
    "duckdb",                    # OLAP
    "polars",                    # DataFrame
    "pyarrow",                   # Arrow interop dla DuckDB
    "llama_cpp",                 # LLM inference
    "huggingface_hub",           # Model download
    "msgspec",                   # Serializacja
    "stamina",                   # Resilience
    "httpx",                     # HTTP client
    "hishel",                    # HTTP cache
    "nats",                      # NATS client (import nats)
    "taskiq",                    # Task queue
    "taskiq_nats",               # Taskiq NATS broker
    "loguru",                    # Logging
    "structlog",                 # Structured logging
    "pendulum",                  # DateTime
    "opentelemetry",             # OpenTelemetry (API + SDK w jednym)
    "fsspec",                    # Filesystem abstraction
    "sqlite_vec",                # Vector extension dla SQLite
    "alembic",                   # Migracje baz danych
    "anyio",                     # Async runtime
    "lxml",                      # XML processing
    "PIL",                       # Image processing (Pillow)
]

# ── Data directories (dołączane do .exe) ─────────────────────────────────
include-data-dir = [
    # Tylko katalogi z danymi NIE-Pythonowymi — kod źródłowy jest kompilowany przez Nuitka
    "nexus_ai/config/=nexus_ai/config/",  # Pliki konfiguracyjne (TOML, JSON) wewnątrz pakietu
    "app_data/=app_data/",               # Runtime data (puste na start)
    "assets/=assets/",                   # Ikony i loga
    "nexus_ai/db/migrations/=nexus_ai/db/migrations/",  # Alembic migracje (SQL templates)
]

# ── Include specific files ───────────────────────────────────────────────
include-data-files = [
    "pyproject.toml=pyproject.toml",
    # alembic.ini usunięty — konfiguracja Alembic w [tool.alembic] pyproject.toml
    "README.md=README.md",
]

# ── Exclude unnecessary modules ──────────────────────────────────────────
exclude-module = [
    "tkinter",
    "unittest",
    "distutils",
    "setuptools",
    "pip",
    "pdb",
    "test",
]

# ── Windows-specific ─────────────────────────────────────────────────────
# windows-console-mode = "disable"  # Odkomentuj dla GUI bez konsoli
windows-icon-from-ico = "assets/nexus.ico"

# ── Advanced ─────────────────────────────────────────────────────────────
# Report pomaga debugować, co zostało włączone do builda
# report = "build/report.xml"  # Odkomentuj do debugowania

# ── Inne opcje ───────────────────────────────────────────────────────────
jobs = 0                # Wszystkie rdzenie CPU do kompilacji
clang = false           # Użyj GCC (domyślnie na Linux)
assume-yes-for-downloads = true  # Automatyczne pobieranie zależności

# ── Build-time module configuration ──────────────────────────────────────
# nofollow-imports=false: Nuitka normalnie podąża za importami (domyślnie)
# prefer-source-code=false: Używa skompilowanych .so/.pyd zamiast źródła
nofollow-imports = false
prefer-source-code = false

# ── macOS ════════════════════════════════════════════════════════════════
# macos-create-app-bundle = false
# macos-signed-app-name = "com.nexusai.app"

# ── Linux ════════════════════════════════════════════════════════════════
# linux-onefile-icon = "assets/nexus.png"
