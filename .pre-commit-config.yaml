# .pre-commit-config.yaml
# NexusAI JDG — Pre-commit hooks for documentation and rule validation
# R11: Wprowadzenie CI/CD dla dokumentacji (RAPORT_P25)
#
# Usage:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: validate-rules
        name: Validate Rego Rules
        entry: python JDG/tools/validate_rules.py --strict
        language: system
        files: ^JDG/rules/.*\.rego$
        pass_filenames: false
        always_run: true

      - id: manifest-check
        name: Check MANIFEST.md is up-to-date
        entry: python JDG/tools/generate_manifest.py --check
        language: system
        files: ^JDG/rules/.*\.rego$
        pass_filenames: false
        always_run: true

      - id: bundle-check
        name: Verify OPA bundle integrity (count .rego files)
        entry: bash -c 'BUNDLE_COUNT=$(find JDG/rules -name "*.rego" | wc -l); echo "✅ Bundle check: $BUNDLE_COUNT plików .rego w rules/"'
        language: system
        files: ^JDG/(rules/.*\.rego|bundles/.*)$
        pass_filenames: false

      - id: opa-check
        name: OPA Syntax Check
        entry: opa check JDG/rules/ -b
        language: system
        files: ^JDG/rules/.*\.rego$
        pass_filenames: false

      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: trailing-whitespace-fixer
        language: python
        types: [text]

      - id: end-of-file-fixer
        name: Fix End of Files
        entry: end-of-file-fixer
        language: python
        types: [text]

      - id: check-yaml
        name: Check YAML
        entry: check-yaml
        language: python
        types: [yaml]

      - id: check-json
        name: Check JSON
        entry: check-json
        language: python
        types: [json]
