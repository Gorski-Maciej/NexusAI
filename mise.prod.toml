# ═══════════════════════════════════════════════════════════════════════════════
# mise.prod.toml — Konfiguracja produkcyjna
# ═══════════════════════════════════════════════════════════════════════════════
#
# Aktywowana przez:  MISE_ENV=prod mise run <task>
#                   MISE_ENV=prod mise run api          # uruchom API w prod
#                   MISE_ENV=prod mise run migrate      # migracje w prod
#
# Hierarchia ładowania (późniejszy nadpisuje wcześniejszy):
#   1. mise.toml          (bazowa, wspólna dla wszystkich)
#   2. mise.prod.toml     (środowiskowa — ten plik)
#   3. mise.local.toml    (lokalne nadpisania, gitignorowany)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ── Ustawienia mise (nadpisania produkcyjne) ─────────────────────────────────
[settings]
# W prod używamy mniej równoległych jobów — oszczędność CPU dla serwera
jobs = 2

# ── Zmienne środowiskowe (nadpisania produkcyjne) ────────────────────────────
[env]
# Produkcja nasłuchuje na wszystkich interfejsach
NEXUS_HOST = "0.0.0.0"
NEXUS_PORT = "8000"

# Mniej logowania w prod — tylko ostrzeżenia i błędy
NEXUS_LOG_LEVEL = "warn"

# Produkcyjna ścieżka bazy danych (poza katalogiem projektu)
# NEXUS_DB_PATH = "/var/lib/nexusai/nexus.db"

# W prod nie używamy UNIX socket — API dostępne przez TCP
# (odkomentuj by włączyć UNIX socket zamiast TCP)
# NEXUS_UNIX_SOCKET = "/var/run/nexusai/api.sock"

# W prod wyłącz tryb watch
NEXUS_WATCH_INTERVAL = "0"

# ── Tasks — nadpisania produkcyjne ──────────────────────────────────────────
# Taski które w prod różnią się od dev (np. bez hot-reload)

[tasks.api]
description = "Uruchom serwer API w produkcji (Granian + Litestar, bez reload)"
run = "python main.py --mode api"

[tasks.api-dev]
description = "Niedostępne w produkcji — użyj: mise run api"
run = "echo 'api-dev is not available in production — use: mise run api'"
