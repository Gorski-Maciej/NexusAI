# ═══════════════════════════════════════════════════════════════════════════════
# user.nuitka-package-config.yml — Nuitka Package Configuration for NexusAI
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file tells Nuitka how to handle third-party packages during compilation.
# It covers:
#   - Native shared libraries (DLLs/SOs) that must be bundled
#   - Data files required at runtime
#   - Module exclusions and inclusions
#   - Package-specific behaviors
#
# Usage:
#   python -m nuitka --user-package-configuration-file=user.nuitka-package-config.yml main.py
#
# Or via source-level directive in main.py:
#   # nuitka-project: --user-package-configuration-file={MAIN_DIRECTORY}/user.nuitka-package-config.yml
#
# ═══════════════════════════════════════════════════════════════════════════════


# ── llama-cpp-python — GGUF model inference (CPU/GPU) ───────────────────────
# Native libraries: libllama.so, libggml.so, libggml-base.so, libggml-cpu.so
# Data: GGUF model files (downloaded at runtime, not bundled)
- package-name: 'llama_cpp'
  module-name: 'llama_cpp'
  stdlib: no
  dlls:
    - 'libllama.so'
    - 'libggml.so'
    - 'libggml-base.so'
    - 'libggml-cpu.so'
    - 'libggml-cuda.so'     # CUDA-backed GGML
    - 'libggml-metal.so'    # Metal-backed GGML (macOS)
    - 'libggml-vulkan.so'   # Vulkan-backed GGML
  # Do not follow imports to test/benchmark modules
  nofollow:
    - 'llama_cpp.*test*'
    - 'llama_cpp.*bench*'

# ── lxml — XML/HTML processing (KSeF integration) ───────────────────────────
# Native libraries: libxml2, libxslt, libexslt
- package-name: 'lxml'
  module-name: 'lxml'
  stdlib: no
  dlls:
    - 'libxml2.so'
    - 'libxslt.so'
    - 'libexslt.so'

# ── Pillow (PIL) — image processing (OCR preprocessing) ─────────────────────
# Native libraries: libjpeg, libpng, libtiff, libwebp, libz, liblcms2, libopenjp2
- package-name: 'PIL'
  module-name: 'PIL'
  stdlib: no
  dlls:
    - 'libjpeg.so'
    - 'libpng16.so'
    - 'libtiff.so'
    - 'libwebp.so'
    - 'libwebpmux.so'
    - 'libz.so'
    - 'liblcms2.so'
    - 'libopenjp2.so'
  # Exclude test images bundled with Pillow
  nofollow:
    - 'PIL.*test*'

# ── PyMuPDF (fitz) — PDF → image conversion (OCR pipeline) ─────────────────
# Native libraries: libmupdf, libmupdf-third
- package-name: 'fitz'
  module-name: 'fitz'
  stdlib: no
  dlls:
    - 'libmupdf.so'
    - 'libmupdf-third.so'

# ── DuckDB — embedded OLAP engine ───────────────────────────────────────────
# DuckDB is a native library loaded via ctypes/cffi
- package-name: 'duckdb'
  module-name: 'duckdb'
  stdlib: no
  dlls:
    - 'libduckdb.so'

# ── Polars — DataFrame library (Rust-powered) ───────────────────────────────
# Polars bundles its native libraries as Python extension modules
- package-name: 'polars'
  module-name: 'polars'
  stdlib: no
  # Polars uses pyo3, no additional DLLs needed beyond extension modules

# ── Granian — Rust ASGI server ──────────────────────────────────────────────
- package-name: 'granian'
  module-name: 'granian'
  stdlib: no

# ── NATS — messaging broker client ──────────────────────────────────────────
- package-name: 'nats'
  module-name: 'nats'
  stdlib: no
  nofollow:
    - 'nats.aio.test*'

# ── PaddleOCR — deep learning OCR engine ───────────────────────────────────
# Large package with many dependencies and data files
- package-name: 'paddleocr'
  module-name: 'paddleocr'
  stdlib: no
  nofollow:
    - 'paddleocr.*test*'

# ── PaddlePaddle — deep learning framework ──────────────────────────────────
- package-name: 'paddle'
  module-name: 'paddle'
  stdlib: no
  nofollow:
    - 'paddle.*test*'
    - 'paddle.*example*'

# ── Surya OCR — layout-aware OCR ────────────────────────────────────────────
- package-name: 'surya_ocr'
  module-name: 'surya_ocr'
  stdlib: no

# ── Torch — optional, loaded only for vision agent ──────────────────────────
# Only include if needed — very large.
- package-name: 'torch'
  module-name: 'torch'
  stdlib: no
  nofollow:
    - 'torch.*test*'
    - 'torch.*example*'
    - 'torch.contrib.*'
    - 'torch.backends.*'

# ── transformers — HuggingFace transformer models ───────────────────────────
- package-name: 'transformers'
  module-name: 'transformers'
  stdlib: no
  nofollow:
    - 'transformers.*test*'
    - 'transformers.*benchmark*'

# ── OpenCV — computer vision preprocessing (OCR pipeline) ───────────────────
# Native libraries: libopencv_core, libopencv_imgproc, libopencv_imgcodecs
- package-name: 'cv2'
  module-name: 'cv2'
  stdlib: no
  dlls:
    - 'libopencv_core.so'
    - 'libopencv_imgproc.so'
    - 'libopencv_imgcodecs.so'
    - 'libopencv_highgui.so'
  nofollow:
    - 'cv2.*test*'
    - 'cv2.*gapi*'
    - 'cv2.*flann*'

# ── Tesseract OCR — classic OCR engine ──────────────────────────────────────
# Accessed via subprocess, not Python import — no Nuitka config needed
# Native tesseract binary is bundled separately in the installer

# ── SQLite-vec — vector search extension for SQLite ─────────────────────────
- package-name: 'sqlite_vec'
  module-name: 'sqlite_vec'
  stdlib: no

# ── SQLCipher — encrypted SQLite extension ───────────────────────────────────
# libsqlcipher.so is loaded at runtime via ctypes in database.py
# Nuitka cannot detect it statically — must be in distribution folder
- package-name: 'nexus_ai'
  module-name: 'nexus_ai.db.database'
  dlls:
    - 'libsqlcipher.so'
