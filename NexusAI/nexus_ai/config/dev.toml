# ═══════════════════════════════════════════════════════════════════════════════
# config/dev.toml — NexusAI Development Profile
# ═══════════════════════════════════════════════════════════════════════════════
#
# Zgodnie z aa3fvcx.txt:
# - msgspec parsuje TOML → zero zależności od python-dotenv
# - Konfiguracja w czystym TOML zamiast .env
# - Struktura zdefiniowana jako msgspec.Struct w core/config.py
#
# Ładowane przez: ConfigLoader (core/config.py)
#   config = toml.decode(f.read(), type=Config)
#
# Użycie: NEXUS_ENV=dev (domyślnie)
# ═══════════════════════════════════════════════════════════════════════════════

[app]
# ── Core ──
environment = "dev"
debug = true
base_dir = "."

# ── Database ──
sqlite_file = "app_data/databases/nexus_oltp.db"
duckdb_file = "app_data/databases/nexus_olap.duckdb"
storage_dir = "app_data/uploads"
idempotency_db = "app_data/databases/idempotency.sqlite"

# ── DuckDB ──
duckdb_memory_limit = "512MB"
duckdb_threads = 2

# ── Server ──
host = "127.0.0.1"
port = 8000
log_level = "DEBUG"

# ── CORS (dev: zezwól na wszystko) ──
cors_origins = "*"

# ── Upload limits ──
max_invoice_upload_mb = 50
max_attachment_upload_mb = 500

# ── JWT (dev: auto-generowane jeśli puste) ──
jwt_expiration_seconds = 900
refresh_token_days = 30
jwt_issuer = "nexus-ai"
jwt_audience = "nexus-api"

# ── CSRF ──
csrf_enabled = true

# ── Connection pools ──
db_pool_size = 5
db_pool_overflow = 10
nats_max_reconnect = 10
nats_reconnect_delay_seconds = 2

[storage]
# ── SUPERMOC fsspec: Jednolita abstrakcja systemów plików ──
protocol = "file"
root = "app_data/uploads"
auto_mkdir = true
cache_size_mb = 100

# ── Transactional support (atomic writes) ──
transactional = true

# ── Chaining: compose filesystems (simplecache::file, cached::s3) ──
chain_enabled = true
chain_cache_storage = "app_data/fsspec_cache"

# ── Retry (stamina) ──
max_task_retries = 3
retry_backoff_base_seconds = 1.0
retry_backoff_max_seconds = 60.0

# ── Decision Engine ──
autopilot_auto_post_threshold = 0.92
autopilot_suggest_threshold = 0.75
autopilot_ask_threshold = 0.50
autopilot_adaptation_enabled = true
autopilot_adaptation_learning_rate = 0.05
autopilot_low_amount_threshold = 500.0

# ── Rules ──
rules_max_invoice_amount = 100000.0
rules_require_nip_validation = true
analytics_anomaly_threshold = 2.0

# ── Timeouts ──
decision_timeout_seconds = 60

# ── Outbox ──
outbox_replay_limit = 100

# ── Migration baselines ──
migration_baseline_file = "migration_rowcount_baseline.json"
migration_checksum_baseline_file = "migration_checksum_baseline.json"

[nats]
# ── NATS JetStream (dev) ──
url = "nats://localhost:4222"
max_reconnect = 10
reconnect_delay_seconds = 2

[stamina]
# ── SUPERMOC: Globalne ustawienia stamina (dev) ──
retry_attempts = 3
retry_timeout = 10.0
circuit_breaker_enabled = true
circuit_breaker_cooldown = 60.0
