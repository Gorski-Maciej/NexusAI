<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06d6a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Nexus symbol: interconnected nodes -->
  <g transform="translate(20, 20)">
    <!-- Outer ring -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#grad)" stroke-width="3"/>
    <!-- Inner connected nodes -->
    <circle cx="40" cy="10" r="8" fill="url(#grad)" opacity="0.9"/>
    <circle cx="40" cy="70" r="8" fill="url(#grad)" opacity="0.9"/>
    <circle cx="10" cy="40" r="8" fill="url(#grad)" opacity="0.9"/>
    <circle cx="70" cy="40" r="8" fill="url(#grad)" opacity="0.9"/>
    <!-- Center node -->
    <circle cx="40" cy="40" r="10" fill="url(#gradAccent)"/>
    <!-- Connection lines -->
    <line x1="40" y1="18" x2="40" y2="30" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="50" x2="40" y2="62" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="40" x2="30" y2="40" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="40" x2="62" y2="40" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
    <!-- Diagonal connections -->
    <line x1="20" y1="20" x2="32" y2="32" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="48" y1="48" x2="60" y2="60" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="60" y1="20" x2="48" y2="32" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="32" y1="48" x2="20" y2="60" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
    <!-- Small connection dots -->
    <circle cx="22" cy="22" r="2" fill="#00b4d8" opacity="0.5"/>
    <circle cx="58" cy="22" r="2" fill="#00b4d8" opacity="0.5"/>
    <circle cx="22" cy="58" r="2" fill="#00b4d8" opacity="0.5"/>
    <circle cx="58" cy="58" r="2" fill="#00b4d8" opacity="0.5"/>
  </g>

  <!-- Brand name -->
  <text x="130" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#e0e0e0" letter-spacing="2">
    Nexus<tspan fill="url(#grad)">AI</tspan>
  </text>
  <text x="130" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#707080" letter-spacing="4">
    ACCOUNTING SYSTEM
  </text>
</svg>
