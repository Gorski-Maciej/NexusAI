# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Auto-Labeler Workflow
# ═══════════════════════════════════════════════════════════════════════════════
#
# Automatycznie dodaje etykiety do PR na podstawie zmienionych plików.
# Używa konfiguracji z .github/labeler.yml
#
# SUPERMOCE:
#   - pull_request_target — bezpieczne dla forków
#   - sync-labels — synchronizacja etykiet z bieżącymi zmianami
#   - .github/labeler.yml — konfiguracja w osobnym pliku
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Auto Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
