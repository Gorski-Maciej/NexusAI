# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Reusable: Setup pixi Environment
# ═══════════════════════════════════════════════════════════════════════════════
# Reusable workflow — użyj przez:
#   jobs:
#     setup-env:
#       uses: ./.github/workflows/setup-pixi.yml
#       with:
#         pixi-env: dev
#       secrets:
#         NEXUS_SENTRY_DSN: ${{ secrets.NEXUS_SENTRY_DSN }}
#
# SUPERMOCE:
#   - workflow_call — reusable przez inne workflowy
#   - inputs + secrets — elastyczna konfiguracja
#   - pixi cache — szybkie kolejne uruchomienia
#
name: Setup pixi Environment
on:
  workflow_call:
    inputs:
      pixi-env:
        description: "Pixi environment to install (dev/prod)"
        default: "dev"
        type: string
      install-deps:
        description: "Run pixi install --locked"
        default: true
        type: boolean
    secrets:
      NEXUS_SENTRY_DSN:
        description: "Sentry DSN for error tracking (optional)"
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure Sentry DSN
        if: ${{ secrets.NEXUS_SENTRY_DSN != '' }}
        run: echo "NEXUS_SENTRY_DSN=${{ secrets.NEXUS_SENTRY_DSN }}" >> $GITHUB_ENV

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: ${{ inputs.pixi-env }}
          cache: true

      - name: Verify lockfile
        if: inputs.install-deps
        run: pixi install --environment ${{ inputs.pixi-env }} --locked

      - name: Environment diagnostics
        run: |
          pixi run -e ${{ inputs.pixi-env }} python --version
          pixi run -e ${{ inputs.pixi-env }} python -c "import sys; print('✅', '${{ inputs.pixi-env }}', sys.version)"
