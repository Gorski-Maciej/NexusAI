# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Composite Action: Setup Hatch
# ═══════════════════════════════════════════════════════════════════════════════
# Użyj w jobie:
#   steps:
#     - uses: ./.github/actions/setup-hatch
#       with:
#         cache-key-prefix: hatch-ci
#
# SUPERMOCE:
#   - composite action — DRY
#   - hatch + cache + restore-keys

name: "Setup Hatch"
description: "Installs hatch build system with cache"

inputs:
  cache-key-prefix:
    description: "Prefix for cache key"
    default: "hatch"
    type: string

runs:
  using: "composite"
  steps:
    - name: Install pipx
      shell: bash
      run: pip install pipx && pipx ensurepath

    - name: Install hatch
      shell: bash
      run: pipx install hatch

    - name: Cache hatch environments
      uses: actions/cache@v4
      with:
        path: |
          ~/.hatch/env/virtual
          ~/.cache/pip
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'pixi.lock') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-
          ${{ inputs.cache-key-prefix }}-

    - name: Verify hatch
      shell: bash
      run: |
        hatch --version
        echo "✅ Hatch ready"
