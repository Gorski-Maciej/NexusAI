# ═══════════════════════════════════════════════════════════════════════════════
# NexusAI — Composite Action: Setup pixi
# ═══════════════════════════════════════════════════════════════════════════════
# Użyj w jobie:
#   steps:
#     - uses: ./.github/actions/setup-pixi
#       with:
#         pixi-env: dev
#
# SUPERMOCE:
#   - composite action — DRY, jedna zmiana = wszystkie workflowy
#   - pixi cache + lockfile verify

name: "Setup pixi"
description: "Installs and configures pixi environment with cache"

inputs:
  pixi-env:
    description: "Pixi environment (dev/prod)"
    default: "dev"
    type: string

runs:
  using: "composite"
  steps:
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.8
      with:
        pixi-version: latest
        environments: ${{ inputs.pixi-env }}
        cache: true

    - name: Verify lockfile
      shell: bash
      run: pixi install --environment ${{ inputs.pixi-env }} --locked

    - name: Environment diagnostics
      shell: bash
      run: |
        pixi run -e ${{ inputs.pixi-env }} python --version
        pixi run -e ${{ inputs.pixi-env }} python -c "import sys; print('✅', '${{ inputs.pixi-env }}', sys.version)"
