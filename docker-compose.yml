# =============================================================================
# NexusAI - Docker Compose
# =============================================================================
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f
#
# Stop all services:
#   docker-compose down
#
# Access API: http://localhost:8000
# Swagger UI: http://localhost:8000/schema/swagger
# NATS port:  localhost:4222 (for external clients)
# =============================================================================

version: "3.9"

x-base-environment: &base-environment
  NEXUS_ENV: dev
  NEXUS_DEBUG: "1"
  NEXUS_HOST: 0.0.0.0
  NEXUS_PORT: 8000
  NEXUS_NATS_URL: nats://nats:4222
  NEXUS_BASE_DIR: /app/app_data
  NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-dev-docker-jwt-secret-change-in-production}
  NEXUS_ENCRYPTION_KEY: ${NEXUS_ENCRYPTION_KEY:-}
  NEXUS_ADMIN_USERNAME: ${NEXUS_ADMIN_USERNAME:-admin}
  NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-admin}
  NEXUS_STORAGE_DIR: app_data/uploads
  NEXUS_MAX_INVOICE_UPLOAD_MB: "50"
  NEXUS_MAX_ATTACHMENT_UPLOAD_MB: "500"
  NEXUS_DUCKDB_MEMORY_LIMIT: 512MB
  NEXUS_DUCKDB_THREADS: "2"
  NEXUS_MAX_PARALLEL_OCR: "1"
  NEXUS_OCR_TIMEOUT_SEC: "300"
  NEXUS_LOG_LEVEL: info
  NEXUS_CORS_ORIGINS: "*"
  NEXUS_SQLITE_FILE: nexus_oltp.db
  NEXUS_DUCKDB_FILE: nexus_olap.duckdb
  TB_CLUSTER_ID: "0"
  TB_REPLICA_ADDRESSES: tigerbeetle:3000
  PYTHONPATH: /app/Code:/app

services:

  # ── NATS JetStream Message Broker ──────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command:
      - "-js"         # Enable JetStream
      - "-p"
      - "4222"
      - "-m"
      - "8222"
      - "--store_dir"
      - "/data/nats"
    volumes:
      - nats_data:/data/nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus_net

  # ── TigerBeetle Ledger ─────────────────────────────────────────────────────
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle_data:/data
    command: >
      start --addresses=0.0.0.0:3000 --cluster=0 /data/nexus_ledger.tb
    healthcheck:
      test: ["CMD", "tigerbeetle", "check", "/data/nexus_ledger.tb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nexus_net

  # ── API Server (Litestar / Uvicorn) ────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    image: nexusai-api:latest
    ports:
      - "8000:8000"
    environment: *base-environment
    volumes:
      - app_data:/app/app_data
      - ./models:/app/models:ro
    depends_on:
      nats:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
    networks:
      - nexus_net
    restart: unless-stopped

  # ── Taskiq Worker (OCR / AI Processing) ────────────────────────────────────
  worker:
    build:
      context: .
      target: worker
    image: nexusai-worker:latest
    environment: *base-environment
    volumes:
      - app_data:/app/app_data
      - ./models:/app/models:ro
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - nexus_net
    restart: unless-stopped
    # Scale workers for parallel processing:
    # docker-compose up -d --scale worker=3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

networks:
  nexus_net:
    driver: bridge

volumes:
  nats_data:
  tigerbeetle_data:
  app_data:
