# Prometheus Alerting Rules for NexusAI
# Load this file into Prometheus via: rule_files: ["deploy/prometheus/alert_rules.yml"]
#
# Required metric sources:
#   - http_requests_total        (counter, labels: method, endpoint, status)
#   - ai_inference_duration_seconds (histogram, labels: model_name)
#   - nats_events_queued_total   (counter)
#   - nats_events_processed_total (counter)
#   - node_filesystem_*          (from node_exporter)
#   - nats_up                    (gauge, from blackbox or direct check)
#   - worker_up                  (gauge, from /api/v1/health endpoint)

groups:
  - name: nexus_alerts
    interval: 30s
    rules:
      # ── High error rate ───────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate (>1% 5xx)"
          description: |
            More than 1% of HTTP requests are returning 5xx errors
            in the last 5 minutes.

      # ── NATS queue depth ──────────────────────────────────────────────
      - alert: NATSQueueDepth
        expr: |
          nats_events_queued_total - nats_events_processed_total > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "NATS queue depth exceeds 1000"
          description: |
            NATS event queue has {{ $value }} unprocessed messages.
            Worker may be overloaded or unavailable.

      # ── Model inference too slow ───────────────────────────────────────
      - alert: ModelInferenceSlow
        expr: |
          ai_inference_duration_seconds{quantile="0.95"} > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI model inference P95 > 30s"
          description: |
            P95 AI inference duration is {{ $value }}s.
            Check GPU/CPU utilization and model loading.

      # ── Low disk space ─────────────────────────────────────────────────
      - alert: LowDiskSpace
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
          /
          node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space (<10% free)"
          description: |
            Only {{ $value | humanizePercentage }} disk space remaining.
            Backup and cleanup required immediately.

      # ── NATS server down ───────────────────────────────────────────────
      - alert: NATSDown
        expr: nats_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NATS server is down"
          description: "NATS server is unreachable. Task processing is disabled."

      # ── Hot-reload inactivity ───────────────────────────────────────────
      - alert: NoHotReloadEvents
        expr: rate(hot_reload_events_total[24h]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "No hot-reload events in 24h — possible NATS issue"
          description: |
            The hot_reload_events_total counter has not increased in the
            last 24 hours. This means no billing, risk, tax, or ledger
            rules were updated via the admin API — or the NATS connection
            is down and events are not being received.
            Check NATS subscription health at /api/admin/hot-reload/health

      # ── Worker down ────────────────────────────────────────────────────
      - alert: WorkerDown
        expr: worker_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taskiq worker is down"
          description: |
            No active worker processing tasks.
            OCR and AI tasks will queue up indefinitely.
